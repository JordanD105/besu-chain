# keepalived on 192.168.68.133 -> /etc/keepalived/keepalived.conf   (steps: ha/README.md)
# Two floating IPs, held here only when .132 fails (priority 100; .132 has 150):
#   192.168.68.150  HAProxy: Besu RPC :8545 and MPC signer :9100
#   192.168.68.151  the proxy :30000 (only the holder runs a proxy)
# Replace INTERFACE (ip -br addr) and both auth_pass values (max 8 characters, same on .132).
global_defs {
    router_id besu_133
    script_user root
    enable_script_security
}

vrrp_script chk_haproxy {
    script "/usr/bin/curl -sf -m 2 -o /dev/null http://127.0.0.1:8404/healthz"
    interval 2
    fall 3
    rise 2
}

vrrp_script chk_proxy {
    script "/etc/keepalived/check-proxy.sh"
    interval 3
    fall 3
    rise 2
}

vrrp_instance VI_RPC {
    state BACKUP
    nopreempt
    interface INTERFACE
    virtual_router_id 51
    priority 100
    advert_int 1
    unicast_src_ip 192.168.68.133
    unicast_peer {
        192.168.68.132
    }
    authentication {
        auth_type PASS
        auth_pass CHANGE01
    }
    virtual_ipaddress {
        192.168.68.150/24
    }
    track_script {
        chk_haproxy
    }
}

vrrp_instance VI_PROXY {
    state BACKUP
    nopreempt
    interface INTERFACE
    virtual_router_id 52
    priority 100
    advert_int 1
    unicast_src_ip 192.168.68.133
    unicast_peer {
        192.168.68.132
    }
    authentication {
        auth_type PASS
        auth_pass CHANGE02
    }
    virtual_ipaddress {
        192.168.68.151/24
    }
    track_script {
        chk_proxy
    }
    notify_master "/etc/keepalived/proxy-start.sh"
    notify_backup "/etc/keepalived/proxy-stop.sh"
    notify_fault  "/etc/keepalived/proxy-stop.sh"
}
