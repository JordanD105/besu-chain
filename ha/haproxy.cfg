# HAProxy for the production layout (docs/overview/production-layout.md). The SAME file on .135 and .136:
# both run HAProxy all the time; keepalived decides which one holds the VIP 192.168.68.150.
#   haproxy -c -f /etc/haproxy/haproxy.cfg && systemctl enable --now haproxy
# Needs net.ipv4.ip_nonlocal_bind=1 (binding the VIP on the host that does not hold it) and, with
# SELinux, setsebool -P haproxy_connect_any 1. Steps: docs/deployment/high-availability.md
global
    log /dev/log local0
    maxconn 4000              # a few hundred connections are used; higher values need more file descriptors

defaults
    mode http
    log global
    option httplog
    timeout connect 3s
    timeout client  120s
    timeout server  120s      # cold MPC signing and key generation take seconds
    retries 2
    option redispatch

# Health endpoint for keepalived's check (local only)
frontend health
    bind 127.0.0.1:8404
    monitor-uri /healthz

# Besu JSON-RPC: rpc1 (.135) normally, rpc2 (.136) only when rpc1 is unhealthy. One node at a
# time, so the proxy reads nonces from the same pool the coordinator sends to. A node that is
# syncing (eth_syncing != false) is not used. rpc1 and rpc2 must have 192.168.68.150 in
# BESU_HOST_ALLOWLIST: clients send Host: 192.168.68.150.
frontend besu_rpc
    bind 192.168.68.150:8545
    default_backend besu_rpc
backend besu_rpc
    option httpchk
    http-check send meth POST uri / ver HTTP/1.1 hdr Host 192.168.68.150 hdr Content-Type application/json body "{\"jsonrpc\":\"2.0\",\"id\":1,\"method\":\"eth_syncing\",\"params\":[]}"
    http-check expect rstring "\"result\" *: *false"
    server rpc1 192.168.68.135:8555 check inter 2s fall 3 rise 2
    server rpc2 192.168.68.136:8555 check inter 2s fall 3 rise 2 backup

# MPC signer (Ethereum signer JSON-RPC + admin API): coord1 (.135) normally, coord2 (.136)
# when coord1 is down. coord2 runs all the time with its own presignature pool full (warm) and
# re-reads the key list from the MPC nodes, so it signs for every account at once.
frontend mpc_signer
    bind 192.168.68.150:9100
    default_backend mpc_signer
backend mpc_signer
    option httpchk GET /health
    http-check expect status 200
    server coord1 192.168.68.135:9100 check inter 2s fall 3 rise 2
    server coord2 192.168.68.136:9100 check inter 2s fall 3 rise 2 backup
