[package]
name = "mpc-signer"
version = "0.1.0"
edition = "2021"
description = "Non-exportable 2-of-3 threshold ECDSA signer for Hyperledger Besu (CGGMP24 / LFDT Lockness)"
license = "Apache-2.0"
publish = false

[features]
default = ["bigint-num"]
# Pure-Rust big integers (permissive licence). Default.
bigint-num = ["cggmp24/backend-num-bigint"]
# GMP-backed big integers: several times faster presigning, but pulls in an LGPL dependency.
bigint-rug = ["cggmp24/backend-rug"]

[dependencies]
# Threshold ECDSA. 0.7.x is the line with the presignature/HD fixes (successor of cggmp21 0.6).
# NOTE: "hd-wallet" and "spof" are deliberately NOT enabled.
cggmp24 = { version = "=0.7.0-alpha.3", default-features = false, features = ["std", "curve-secp256k1"] }
# Pin the companion crates: a newer published keygen alpha pulls an incompatible generic-ec.
cggmp24-keygen = "=0.7.0-alpha.3"
paillier-zk = { version = "=0.7.0-alpha.3", default-features = false }
round-based = { version = "0.4.1", features = ["runtime-tokio"] }

tokio = { version = "1", features = ["full"] }
futures = "0.3"
axum = { version = "0.7", features = ["ws"] }
tokio-tungstenite = "0.24"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
bincode = "1.3"
hex = "0.4"
uuid = { version = "1", features = ["v4"] }

rand_core = { version = "0.6", features = ["getrandom"] }
sha2 = "0.10"
sha3 = "0.10"
hkdf = "0.12"
k256 = { version = "0.13", features = ["ecdsa"] }
ed25519-dalek = { version = "2", features = ["rand_core"] }
x25519-dalek = { version = "2", features = ["static_secrets"] }
chacha20poly1305 = "0.10"
argon2 = "0.5"
zeroize = "1"

anyhow = "1"
thiserror = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4", features = ["derive", "env"] }
parking_lot = "0.12"

[dev-dependencies]
round-based = { version = "0.4.1", features = ["sim", "sim-async"] }

[profile.release]
codegen-units = 1
lto = "thin"
