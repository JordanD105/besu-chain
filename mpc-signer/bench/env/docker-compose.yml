# Benchmark environment: one Besu QBFT node (chain id 1337, zero gas price) on localhost:8545.
# The MPC signer under test runs next to it (quickstart/ or scripts/local-cluster.sh) and its
# coordinator forwards transactions to this node.
services:
  besu:
    image: hyperledger/besu:${BESU_VERSION:-latest}
    container_name: bench-besu
    command:
      - --genesis-file=/net/genesis.json
      - --node-private-key-file=/net/key
      - --data-path=/opt/besu/data
      - --min-gas-price=0
      - --host-allowlist=*
      - --rpc-http-enabled
      - --rpc-http-host=0.0.0.0
      - --rpc-http-api=ETH,NET,WEB3,TXPOOL,QBFT
      - --rpc-http-max-active-connections=2000
      - --tx-pool-max-future-by-sender=100000
      - --tx-pool-layer-max-capacity=100000000
      - --tx-pool-max-prioritized=100000
    volumes:
      - ./besu-net/genesis.json:/net/genesis.json:ro
      - ./besu-net/node.key:/net/key:ro
    ports:
      - "8545:8545"
    networks: [bench]

networks:
  bench:
    driver: bridge
