groups:
  - name: hosts
    rules:
      - alert: HostDown
        expr: up{job="hosts"} == 0
        for: 2m
        labels: { severity: warning }
        annotations:
          summary: "node-exporter on {{ $labels.host }} ({{ $labels.instance }}) is not answering"

      - alert: HostDiskFull
        expr: 1 - node_filesystem_avail_bytes{job="hosts",fstype!~"tmpfs|overlay|squashfs|nsfs|ramfs"} / node_filesystem_size_bytes{job="hosts",fstype!~"tmpfs|overlay|squashfs|nsfs|ramfs"} > 0.8
        for: 10m
        labels: { severity: warning }
        annotations:
          summary: "{{ $labels.host }} {{ $labels.mountpoint }} is {{ $value | humanizePercentage }} full"

      - alert: HostMemoryHigh
        expr: 1 - node_memory_MemAvailable_bytes{job="hosts"} / node_memory_MemTotal_bytes{job="hosts"} > 0.9
        for: 10m
        labels: { severity: warning }
        annotations:
          summary: "{{ $labels.host }} uses {{ $value | humanizePercentage }} of its memory"

      # node-exporter's timex collector: the kernel's sync flag (set by chrony when synchronized)
      # and its estimated offset. QBFT rejects blocks whose timestamps are off.
      - alert: HostClockNotSynced
        expr: node_timex_sync_status{job="hosts"} == 0 or abs(node_timex_offset_seconds{job="hosts"}) > 0.1
        for: 10m
        labels: { severity: warning }
        annotations:
          summary: "{{ $labels.host }}: clock not synchronized, or more than 100 ms off. Check: chronyc tracking (ntp_servers in the Ansible settings)"
