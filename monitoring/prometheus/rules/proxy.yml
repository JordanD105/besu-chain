groups:
  - name: proxy
    rules:
      - alert: ProxyDown
        expr: up{job="proxy"} == 0
        for: 1m
        labels: { severity: critical }
        annotations:
          summary: "The proxy ({{ $labels.instance }}) is not answering"

      - alert: ProxySenderStalled
        # transactions are ready in the RPC node's pool but blocks keep coming without them
        expr: proxy_sender_stalled == 1
        labels: { severity: critical }
        annotations:
          summary: "{{ $labels.sender }}: transactions ready in Besu's pool are not being mined. The validators do not have them: restart ONE validator (it fetches the pool again); check tx-pool-max-future-by-sender=2000 on the validators"

      - alert: ProxyNonceGap
        # a gap the proxy has not repaired (repair needs the chain to move; fillers need the signer)
        expr: proxy_sender_gap_seconds > 120
        labels: { severity: warning }
        annotations:
          summary: "{{ $labels.sender }}: a nonce has been missing for {{ $value }}s; later transactions wait. See the proxy log"

      - alert: ProxyNonceRepaired
        expr: increase(proxy_sender_nonce_repairs_total[15m]) > 0
        labels: { severity: info }
        annotations:
          summary: "{{ $labels.sender }}: the proxy repaired a nonce gap (lost transactions or filler transactions). See the proxy log"

      - alert: ProxySenderCheckFailing
        expr: proxy_sender_check_error == 1
        for: 2m
        labels: { severity: warning }
        annotations:
          summary: "{{ $labels.sender }}: the proxy cannot read Besu for its background check"

      - alert: ProxyHttpErrors
        # answers with status 5xx (the proxy failed, not the caller's mistake)
        expr: sum(rate(proxy_http_requests_total{code=~"5.."}[5m])) / clamp_min(sum(rate(proxy_http_requests_total[5m])), 1e-9) > 0.05 and sum(rate(proxy_http_requests_total[5m])) > 0.05
        for: 5m
        labels: { severity: warning }
        annotations:
          summary: "{{ $value | humanizePercentage }} of the proxy's answers are 5xx errors (Grafana Proxy & Redis: by route)"

      - alert: ProxySlow
        # 95th percentile of all routes except the slow-by-design ones (account creation and sections: MPC key generation)
        expr: histogram_quantile(0.95, sum by (le) (rate(proxy_http_request_duration_seconds_bucket{route!~"/createaccount|/admin/.*"}[5m]))) > 5
        for: 10m
        labels: { severity: warning }
        annotations:
          summary: "The proxy's 95th-percentile answer time is {{ $value | humanizeDuration }}"

      - alert: ProxyEventLoopBlocked
        expr: proxy_event_loop_lag_max_seconds > 1
        for: 5m
        labels: { severity: warning }
        annotations:
          summary: "The proxy's event loop was blocked for {{ $value | humanizeDuration }}: requests wait (CPU or a long synchronous task)"

      - alert: ProxyRedisDisconnected
        # the proxy keeps working without Redis (memory + chain), but loses its nonce cache on a restart
        expr: proxy_redis_up == 0
        for: 5m
        labels: { severity: warning }
        annotations:
          summary: "The active proxy has no Redis connection (it continues with memory + chain)"

  - name: redis
    rules:
      - alert: RedisDown
        expr: redis_up{job="redis"} == 0 or up{job="redis"} == 0
        for: 2m
        labels: { severity: warning }
        annotations:
          summary: "The active proxy's Redis is not answering"

      - alert: RedisMemoryHigh
        expr: (redis_memory_used_bytes{job="redis"} / redis_memory_max_bytes{job="redis"} > 0.9) and redis_memory_max_bytes{job="redis"} > 0
        for: 10m
        labels: { severity: warning }
        annotations:
          summary: "Redis uses {{ $value | humanizePercentage }} of its maxmemory"
