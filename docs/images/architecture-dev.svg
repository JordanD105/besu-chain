<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1040" viewBox="0 0 1600 1040" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker>
    <marker id="aP" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/></marker>
    <marker id="aG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#059669"/></marker>
    <marker id="aR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e11d48"/></marker>
    <filter id="sh" x="-5%" y="-5%" width="110%" height="115%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.10"/></filter>
  </defs>
  <rect width="1600" height="1040" fill="#f8fafc"/>

  <text x="40" y="52" font-size="30" font-weight="700" fill="#0f172a">besu-chain: development / test environment</text>
  <text x="40" y="82" font-size="16" fill="#475569">Private Hyperledger Besu QBFT network, application proxy, explorer, monitoring and the non-exportable 2-of-3 MPC signer</text>

  <!-- ============ users ============ -->
  <g filter="url(#sh)"><rect x="40" y="120" width="230" height="150" rx="14" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/></g>
  <text x="60" y="152" font-size="18" font-weight="700" fill="#0f172a">Users / apps</text>
  <text x="60" y="180" font-size="14" fill="#334155">• REST clients</text>
  <text x="60" y="202" font-size="14" fill="#334155">• load tests (k6, bench)</text>
  <text x="60" y="224" font-size="14" fill="#334155">• browsers (explorers,</text>
  <text x="74" y="244" font-size="14" fill="#334155">dashboards)</text>

  <!-- ============ proxy ============ -->
  <g filter="url(#sh)"><rect x="330" y="120" width="420" height="250" rx="16" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/></g>
  <text x="352" y="152" font-size="19" font-weight="700" fill="#1e3a8a">proxy/</text>
  <text x="420" y="152" font-size="13.5" fill="#1d4ed8">Node.js / Express API · :30000</text>
  <g font-size="13" fill="#334155">
    <text x="352" y="180">POST /createaccount · /transfer</text>
    <text x="352" y="200">GET  /transfer/:txHash</text>
    <text x="352" y="220">POST /contract/call · /contract/send</text>
    <text x="352" y="240">POST /contract/events · GET /contract/list</text>
  </g>
  <rect x="352" y="256" width="376" height="98" rx="10" fill="#ffffff" stroke="#93c5fd"/>
  <text x="366" y="279" font-size="13.5" font-weight="700" fill="#1e3a8a">Redis :36379</text>
  <text x="366" y="299" font-size="12.5" fill="#334155">nonce counter per sender (INCR) · pending value</text>
  <text x="366" y="317" font-size="12.5" fill="#334155">NFT token id counter</text>
  <text x="366" y="341" font-size="12" fill="#64748b">per-sender ordering: in-process lock (withSenderLock)</text>

  <line x1="270" y1="195" x2="326" y2="195" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>
  <text x="276" y="186" font-size="12" fill="#334155">REST</text>

  <!-- ============ signing tier ============ -->
  <rect x="40" y="420" width="710" height="330" rx="18" fill="#ffffff" stroke="#cbd5e1" stroke-dasharray="6 5"/>
  <text x="60" y="450" font-size="17" font-weight="700" fill="#0f172a">Signing</text>

  <g filter="url(#sh)"><rect x="60" y="468" width="670" height="262" rx="14" fill="#ecfdf5" stroke="#059669" stroke-width="2"/></g>
  <text x="80" y="498" font-size="16" font-weight="700" fill="#064e3b">mpc-signer/</text>
  <text x="80" y="518" font-size="12.5" fill="#047857">2-of-3 threshold ECDSA (CGGMP24) · the private key never exists</text>
  <rect x="80" y="530" width="630" height="62" rx="9" fill="#ffffff" stroke="#6ee7b7"/>
  <text x="94" y="553" font-size="13.5" font-weight="700" fill="#064e3b">mpc-coordinator :9100</text>
  <text x="94" y="574" font-size="12.5" fill="#334155">no key material · presignature pools · relay between nodes · Ethereum signer JSON-RPC</text>
  <g>
    <rect x="80" y="604" width="200" height="62" rx="9" fill="#ffffff" stroke="#6ee7b7"/>
    <text x="180" y="628" font-size="13" font-weight="700" fill="#064e3b" text-anchor="middle">node 0</text>
    <text x="180" y="648" font-size="11.5" fill="#92400e" text-anchor="middle">share x₀ · own policy</text>
    <rect x="295" y="604" width="200" height="62" rx="9" fill="#ffffff" stroke="#6ee7b7"/>
    <text x="395" y="628" font-size="13" font-weight="700" fill="#064e3b" text-anchor="middle">node 1</text>
    <text x="395" y="648" font-size="11.5" fill="#92400e" text-anchor="middle">share x₁ · own policy</text>
    <rect x="510" y="604" width="200" height="62" rx="9" fill="#ffffff" stroke="#6ee7b7"/>
    <text x="610" y="628" font-size="13" font-weight="700" fill="#064e3b" text-anchor="middle">node 2</text>
    <text x="610" y="648" font-size="11.5" fill="#92400e" text-anchor="middle">share x₂ · own policy</text>
  </g>
  <g stroke="#059669" stroke-width="1.6" fill="none">
    <path d="M395 592 L395 600"/><path d="M180 600 L180 596 L610 596 L610 600"/>
  </g>
  <text x="80" y="690" font-size="12" fill="#64748b">any 2 of the 3 nodes sign together; key generation needs all 3;</text>
  <text x="80" y="708" font-size="12" fill="#64748b">quickstart/ runs the whole cluster on one host with Docker Compose</text>

  <!-- proxy -> signer -->
  <path d="M 450 370 L 450 464" stroke="#059669" stroke-width="2" fill="none" marker-end="url(#aG)"/>
  <text x="462" y="400" font-size="12" fill="#334155">eth_sendTransaction</text>
  <text x="462" y="416" font-size="12" fill="#334155">(SIGNER_IP / SIGNER_PORT)</text>


  <rect x="820" y="120" width="740" height="320" rx="18" fill="#faf5ff" stroke="#7c3aed" stroke-width="2"/>
  <text x="842" y="152" font-size="19" font-weight="700" fill="#4c1d95">besu-test-network/</text>
  <text x="1036" y="152" font-size="13.5" fill="#6d28d9">Docker Compose · chain id 1337 · QBFT · 1 s blocks · zero gas price</text>

  <g filter="url(#sh)"><rect x="842" y="172" width="250" height="110" rx="12" fill="#ffffff" stroke="#a78bfa" stroke-width="1.5"/></g>
  <text x="862" y="200" font-size="15" font-weight="700" fill="#4c1d95">rpcnode</text>
  <text x="862" y="222" font-size="13" fill="#334155">JSON-RPC :8545 · WS :8546</text>
  <text x="862" y="242" font-size="13" fill="#334155">ETH, NET, TXPOOL, QBFT, …</text>
  <text x="862" y="266" font-size="12" fill="#64748b">entry point for proxy &amp; signer</text>

  <g filter="url(#sh)"><rect x="1120" y="172" width="420" height="110" rx="12" fill="#ffffff" stroke="#a78bfa" stroke-width="1.5"/></g>
  <text x="1140" y="200" font-size="15" font-weight="700" fill="#4c1d95">QBFT validators</text>
  <g font-size="12.5" font-weight="600" fill="#ffffff">
    <rect x="1140" y="214" width="88" height="30" rx="7" fill="#7c3aed"/><text x="1184" y="234" text-anchor="middle">validator1</text>
    <rect x="1238" y="214" width="88" height="30" rx="7" fill="#7c3aed"/><text x="1282" y="234" text-anchor="middle">validator2</text>
    <rect x="1336" y="214" width="88" height="30" rx="7" fill="#7c3aed"/><text x="1380" y="234" text-anchor="middle">validator3</text>
    <rect x="1434" y="214" width="88" height="30" rx="7" fill="#7c3aed"/><text x="1478" y="234" text-anchor="middle">validator4</text>
  </g>
  <text x="1140" y="268" font-size="12" fill="#64748b">RPC :21001–21004 · node permissioning · static nodes</text>
  <line x1="1092" y1="227" x2="1116" y2="227" stroke="#7c3aed" stroke-width="2" marker-end="url(#aP)" marker-start="url(#aP)"/>
  <text x="1094" y="219" font-size="11" fill="#6d28d9">p2p</text>

  <g filter="url(#sh)"><rect x="1120" y="298" width="420" height="124" rx="12" fill="#ffffff" stroke="#a78bfa" stroke-width="1.5"/></g>
  <text x="1140" y="324" font-size="15" font-weight="700" fill="#4c1d95">Observability</text>
  <text x="1140" y="346" font-size="13" fill="#334155">Prometheus :9090 (Besu metrics :9545) · Grafana :3000</text>
  <text x="1140" y="368" font-size="13" fill="#334155">Loki :3100 ← Alloy :12345 (logs)</text>
  <text x="1140" y="390" font-size="13" fill="#334155">Tempo ← OpenTelemetry Java agent (traces)</text>
  <text x="1140" y="410" font-size="12" fill="#64748b">metrics, logs and traces from every Besu node</text>

  <!-- chainlens (repo root app) -->
  <g filter="url(#sh)"><rect x="820" y="460" width="740" height="100" rx="14" fill="#ecfeff" stroke="#0891b2" stroke-width="2"/></g>
  <text x="842" y="490" font-size="17" font-weight="700" fill="#155e75">chainlens/</text>
  <text x="940" y="490" font-size="13.5" fill="#0e7490">block explorer &amp; dashboard (repo root) · Node.js / Express · :30100</text>
  <text x="842" y="516" font-size="13" fill="#334155">blocks · transactions · accounts · contracts · NFTs (status, dashboard and detail APIs + web UI)</text>
  <text x="842" y="540" font-size="12" fill="#64748b">polls rpcnode JSON-RPC every 4 s and indexes in memory (no database)</text>
  <line x1="967" y1="460" x2="967" y2="288" stroke="#0891b2" stroke-width="2" marker-end="url(#a)"/>
  <text x="975" y="360" font-size="12" fill="#0e7490">JSON-RPC</text>

  <!-- proxy -> besu (reads) -->
  <path d="M 750 160 L 838 200" stroke="#334155" stroke-width="2" fill="none" marker-end="url(#a)"/>
  <text x="770" y="206" font-size="12" fill="#334155">RPC</text>
  <!-- signers -> besu -->
  <path d="M 380 560 L 395 560" stroke="none"/>
  <path d="M 730 560 L 790 560 L 790 255 L 838 255" stroke="#7c3aed" stroke-width="2" fill="none" marker-end="url(#aP)"/>
  <text x="798" y="410" font-size="12" fill="#5b21b6" transform="rotate(-90 798 410)">signed raw tx → rpcnode</text>
  <!-- users -> explorers -->


  <!-- ============ bottom: benchmark + legend ============ -->
  <g filter="url(#sh)"><rect x="820" y="580" width="740" height="170" rx="14" fill="#ffffff" stroke="#f59e0b" stroke-width="1.5"/></g>
  <text x="842" y="610" font-size="16" font-weight="700" fill="#92400e">mpc-signer/bench: MPC signer throughput</text>
  <text x="842" y="636" font-size="13" fill="#334155">bench.js (closed-loop, verifies every signature) drives transactions through the</text>
  <text x="862" y="660" font-size="13" fill="#334155">MPC coordinator: key generation, hot path (pool), end to end, cold path</text>
  <text x="842" y="686" font-size="13" fill="#334155">Sustained rate = presignature generation; hot path = milliseconds per signature</text>
  <text x="842" y="710" font-size="13" fill="#334155">bench/run-bench.sh writes results/&lt;time&gt;.md (docs/development/mpc-benchmarks.md)</text>
  <text x="842" y="734" font-size="12" fill="#64748b">quickstart/ runs the MPC cluster with Docker Compose; deploy/ = one node per host in production</text>

  <g transform="translate(40,800)">
    <rect width="1520" height="200" rx="14" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="20" y="32" font-size="16" font-weight="700" fill="#0f172a">Transaction flow (POST /transfer with the MPC signer)</text>
    <g font-size="13.5" fill="#334155">
      <text x="20" y="64">1. Client calls proxy POST /transfer {from, to, amount}</text>
      <text x="20" y="88">2. proxy: per-sender lock, nonce = max(counter, chain pending), balance check incl. pending</text>
      <text x="20" y="112">3. proxy → mpc-coordinator eth_sendTransaction {from, to, value, nonce, gasPrice 0}</text>
      <text x="20" y="136">4. coordinator → 2 MPC nodes: policy check + partial signature from a presignature</text>
      <text x="780" y="64">5. coordinator combines (r, s), adds v, encodes EIP-155 raw transaction</text>
      <text x="780" y="88">6. eth_sendRawTransaction → rpcnode → validators (QBFT, ~1 s block)</text>
      <text x="780" y="112">7. proxy stores pending value in Redis, returns tx hash</text>
      <text x="780" y="136">8. chainlens/ shows the block and tx; Grafana / Tempo show metrics, logs, traces</text>
    </g>
    <g font-size="12.5">
      <line x1="20" y1="172" x2="56" y2="172" stroke="#059669" stroke-width="2"/><text x="64" y="176" fill="#334155">signing (MPC, non-exportable)</text>
      <line x1="300" y1="172" x2="336" y2="172" stroke="#7c3aed" stroke-width="2"/><text x="344" y="176" fill="#334155">to Besu</text>
      <text x="460" y="176" fill="#64748b">Browsers open chainlens/ :30100 and Grafana :3000.</text>
    </g>
  </g>
</svg>
