<rect width="1500" height="800" fill="#f8fafc"/>
<text x="40" y="46" font-size="26" fill="#0f172a" font-weight="700">Sections and the SectionRegistry</text>
<text x="40" y="73" font-size="15" fill="#475569">Each section has its own API key, 3 accounts and its user accounts. All of it is recorded on chain; only the registry admin writes.</text>
<rect x="40" y="105" width="330" height="100" rx="12" fill="#ecfeff" stroke="#0891b2" stroke-width="2" filter="url(#sh)"/>
<text x="205.0" y="140" font-size="15" fill="#155e75" font-weight="700" text-anchor="middle">chainlens Sections page</text>
<text x="205.0" y="160" font-size="13" fill="#334155" font-weight="400" text-anchor="middle">or the operator with curl</text>
<text x="205.0" y="179" font-size="12" fill="#64748b" font-weight="400" text-anchor="middle">admin token, from ADMIN_ALLOWED_IPS</text>
<rect x="500" y="105" width="420" height="100" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2" filter="url(#sh)"/>
<text x="710.0" y="140" font-size="15" fill="#1e3a8a" font-weight="700" text-anchor="middle">proxy admin API · /admin/sections</text>
<text x="710.0" y="160" font-size="13" fill="#334155" font-weight="400" text-anchor="middle">create, rename, info, key, active,</text>
<text x="710.0" y="179" font-size="12" fill="#64748b" font-weight="400" text-anchor="middle">replace account, archive, user accounts</text>
<rect x="1060" y="105" width="400" height="100" rx="12" fill="#ffffff" stroke="#94a3b8" stroke-width="2" filter="url(#sh)"/>
<text x="1260.0" y="140" font-size="15" fill="#334155" font-weight="700" text-anchor="middle">Readers: both proxies and chainlens</text>
<text x="1260.0" y="160" font-size="13" fill="#334155" font-weight="400" text-anchor="middle">no database: the chain is the record</text>
<text x="1260.0" y="179" font-size="12" fill="#64748b" font-weight="400" text-anchor="middle">sections cached 10 s on the proxy</text>
<path d="M370,155 L498,155" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#aB)"/>
<text x="434" y="145" font-size="12" fill="#334155" font-weight="400" text-anchor="middle">admin API</text>
<rect x="40" y="290" width="1420" height="100" rx="12" fill="#faf5ff" stroke="#7c3aed" stroke-width="2" filter="url(#sh)"/>
<text x="750.0" y="322" font-size="16" fill="#4c1d95" font-weight="700" text-anchor="middle">SectionRegistry v2 (on Besu)</text>
<text x="750.0" y="342" font-size="13" fill="#334155" font-weight="400" text-anchor="middle">per section: name · 3 accounts · API-key hash (keccak256; the key itself is never stored) · active / archived · info fields (up to 32)</text>
<text x="750.0" y="361" font-size="13" fill="#334155" font-weight="400" text-anchor="middle">every account's kind: 1 user · 2 upfront · 3 consumption · 4 payment · 5 retired   ·   registered contracts with their ABI   ·   isConsumptionAccount(address)</text>
<path d="M710,205 L710,288" fill="none" stroke="#059669" stroke-width="2" marker-end="url(#aM)"/>
<rect x="722" y="230" width="300" height="30" rx="15.0" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
<text x="872.0" y="249.32" font-size="12" fill="#064e3b" font-weight="600" text-anchor="middle">signed by the registry admin (MPC key)</text>
<path d="M1260,288 L1260,207" fill="none" stroke="#7c3aed" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#aP)"/>
<text x="1272" y="252" font-size="12" fill="#4c1d95" font-weight="400" text-anchor="start">read (events + views)</text>
