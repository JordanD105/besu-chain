<text x="1112.5" y="494.5" font-size="12.5" fill="#155e75" text-anchor="middle" font-weight="700">.139</text>
<text x="1088" y="534" font-size="13.5" fill="#334155">11 chainlens  :30100</text>
<text x="1088" y="555" font-size="13.5" fill="#334155">12 Remix IDE  :30200</text>
<text x="1088" y="576" font-size="13.5" fill="#334155">13 docs site  :30300</text>
<rect x="1330" y="410" width="230" height="196" rx="12" fill="#fffbeb" stroke="#f59e0b" stroke-width="2" filter="url(#sh)"/>
