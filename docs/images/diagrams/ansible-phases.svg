<text x="348" y="443" font-size="13.5" fill="#9a3412" font-weight="700">HAProxy + keepalived</text>
<text x="314" y="466" font-size="12.5" fill="#64748b" font-family="'JetBrains Mono', Consolas, Menlo, monospace">07-ha.yml</text>
<rect x="314" y="478" width="92" height="24" rx="12.0" fill="#fff7ed" stroke="#ea580c" stroke-width="1.2"/>
<text x="360.0" y="494.5" font-size="12.5" fill="#9a3412" text-anchor="middle" font-weight="700">.135, .136</text>
<text x="314" y="534" font-size="13.5" fill="#334155">besu-rpc-health</text>
<text x="314" y="555" font-size="13.5" fill="#334155">HAProxy, keepalived</text>
<text x="314" y="576" font-size="13.5" fill="#334155">VIPs .150 / .151, proxy up</text>
<rect x="556" y="410" width="230" height="196" rx="12" fill="#ffffff" stroke="#94a3b8" stroke-width="2" filter="url(#sh)"/>
<text x="572" y="444" font-size="22" fill="#0f172a" font-weight="700">08</text>
<text x="606" y="443" font-size="15" fill="#0f172a" font-weight="700">Checks</text>
<text x="572" y="466" font-size="12.5" fill="#64748b" font-family="'JetBrains Mono', Consolas, Menlo, monospace">08-check.yml</text>
<rect x="572" y="478" width="78" height="24" rx="12.0" fill="#ffffff" stroke="#94a3b8" stroke-width="1.2"/>
<text x="611.0" y="494.5" font-size="12.5" fill="#334155" text-anchor="middle" font-weight="700">operator</text>
<text x="572" y="534" font-size="13.5" fill="#334155">Besu, MPC, proxy via VIPs</text>
<text x="572" y="555" font-size="13.5" fill="#334155">registry, admin API</text>
<text x="572" y="576" font-size="13.5" fill="#334155">once: test transfer</text>
<rect x="814" y="410" width="230" height="196" rx="12" fill="#fffbeb" stroke="#f59e0b" stroke-width="2" filter="url(#sh)"/>
<text x="830" y="444" font-size="22" fill="#92400e" font-weight="700">09</text>
<text x="864" y="443" font-size="15" fill="#92400e" font-weight="700">Monitoring</text>
<text x="830" y="466" font-size="12.5" fill="#64748b" font-family="'JetBrains Mono', Consolas, Menlo, monospace">09-monitoring.yml</text>
<rect x="830" y="478" width="49" height="24" rx="12.0" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.2"/>
