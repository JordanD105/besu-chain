<text x="1346" y="174" font-size="12.5" fill="#64748b" font-family="'JetBrains Mono', Consolas, Menlo, monospace">05-besu.yml</text>
<rect x="1346" y="186" width="85" height="24" rx="12.0" fill="#faf5ff" stroke="#7c3aed" stroke-width="1.2"/>
<text x="1388.5" y="202.5" font-size="12.5" fill="#4c1d95" text-anchor="middle" font-weight="700">.135–.138</text>
<text x="1346" y="242" font-size="13.5" fill="#334155">6 node keys, genesis (once)</text>
<text x="1346" y="263" font-size="13.5" fill="#334155">validators, then</text>
<text x="1346" y="284" font-size="13.5" fill="#334155">RPC nodes</text>
<rect x="40" y="410" width="230" height="196" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2" filter="url(#sh)"/>
<text x="56" y="444" font-size="22" fill="#1e3a8a" font-weight="700">06</text>
<text x="90" y="443" font-size="15" fill="#1e3a8a" font-weight="700">Proxy</text>
<text x="56" y="466" font-size="12.5" fill="#64748b" font-family="'JetBrains Mono', Consolas, Menlo, monospace">06-proxy.yml</text>
<rect x="56" y="478" width="165" height="24" rx="12.0" fill="#eff6ff" stroke="#2563eb" stroke-width="1.2"/>
<text x="138.5" y="494.5" font-size="12.5" fill="#1e3a8a" text-anchor="middle" font-weight="700">operator, .135, .136</text>
<text x="56" y="534" font-size="13.5" fill="#334155">SectionRegistry (once)</text>
<text x="56" y="555" font-size="13.5" fill="#334155">contract account center</text>
<text x="56" y="576" font-size="13.5" fill="#334155">proxy settings, redis-exporter</text>
<rect x="298" y="410" width="230" height="196" rx="12" fill="#fff7ed" stroke="#ea580c" stroke-width="2" filter="url(#sh)"/>
