<text x="830" y="534" font-size="13.5" fill="#334155">Prometheus + Grafana</text>
<text x="830" y="555" font-size="13.5" fill="#334155">targets from the IP plan</text>
<text x="830" y="576" font-size="13.5" fill="#334155">every target checked</text>
