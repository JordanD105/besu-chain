<rect width="1600" height="700" fill="#f8fafc"/>
<text x="40" y="50" font-size="26" fill="#0f172a" font-weight="700">site.yml: the phases in the order they run</text>
<text x="40" y="78" font-size="15" fill="#475569">Phases 02–13 first check that the hosts have the current code (code-current.yml). Rerun-safe: keys, genesis, cluster.json and the ceremony are made once.</text>
<rect x="40" y="118" width="230" height="196" rx="12" fill="#ffffff" stroke="#94a3b8" stroke-width="2" filter="url(#sh)"/>
<text x="56" y="152" font-size="22" fill="#0f172a" font-weight="700">00</text>
<text x="90" y="151" font-size="15" fill="#0f172a" font-weight="700">Preflight</text>
<text x="56" y="174" font-size="12.5" fill="#64748b" font-family="'JetBrains Mono', Consolas, Menlo, monospace">00-preflight.yml</text>
<rect x="56" y="186" width="157" height="24" rx="12.0" fill="#ffffff" stroke="#94a3b8" stroke-width="1.2"/>
<text x="134.5" y="202.5" font-size="12.5" fill="#334155" text-anchor="middle" font-weight="700">operator, all hosts</text>
<text x="56" y="242" font-size="13.5" fill="#334155">settings, tools, IPs and OS</text>
<text x="56" y="263" font-size="13.5" fill="#334155">creates state/ and the</text>
<text x="56" y="284" font-size="13.5" fill="#334155">shared secrets</text>
<rect x="298" y="118" width="230" height="196" rx="12" fill="#fffbeb" stroke="#f59e0b" stroke-width="2" filter="url(#sh)"/>
<text x="314" y="152" font-size="22" fill="#92400e" font-weight="700">01</text>
<text x="348" y="151" font-size="15" fill="#92400e" font-weight="700">Hosts</text>
<text x="314" y="174" font-size="12.5" fill="#64748b" font-family="'JetBrains Mono', Consolas, Menlo, monospace">01-hosts.yml</text>
<rect x="314" y="186" width="157" height="24" rx="12.0" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.2"/>
<text x="392.5" y="202.5" font-size="12.5" fill="#92400e" text-anchor="middle" font-weight="700">all hosts .135–.139</text>
<text x="314" y="242" font-size="13.5" fill="#334155">Docker, firewall, chrony</text>
<text x="314" y="263" font-size="13.5" fill="#334155">copies the committed code</text>
<text x="314" y="284" font-size="13.5" fill="#334155">node-exporter</text>
<rect x="556" y="118" width="230" height="196" rx="12" fill="#ffffff" stroke="#94a3b8" stroke-width="2" filter="url(#sh)"/>
<text x="572" y="152" font-size="22" fill="#0f172a" font-weight="700">02</text>
<text x="606" y="151" font-size="15" fill="#0f172a" font-weight="700">Images</text>
<text x="572" y="174" font-size="12.5" fill="#64748b" font-family="'JetBrains Mono', Consolas, Menlo, monospace">02-images.yml</text>
<rect x="572" y="186" width="136" height="24" rx="12.0" fill="#ffffff" stroke="#94a3b8" stroke-width="1.2"/>
<text x="640.0" y="202.5" font-size="12.5" fill="#334155" text-anchor="middle" font-weight="700">operator → hosts</text>
<text x="572" y="242" font-size="13.5" fill="#334155">operator builds MPC, proxy,</text>
<text x="572" y="263" font-size="13.5" fill="#334155">chainlens, Remix, docs once</text>
<text x="572" y="284" font-size="13.5" fill="#334155">and ships them to the hosts</text>
<rect x="814" y="118" width="230" height="196" rx="12" fill="#ecfdf5" stroke="#059669" stroke-width="2" filter="url(#sh)"/>
<text x="830" y="152" font-size="22" fill="#064e3b" font-weight="700">03</text>
<text x="864" y="151" font-size="15" fill="#064e3b" font-weight="700">MPC nodes</text>
<text x="830" y="174" font-size="12.5" fill="#64748b" font-family="'JetBrains Mono', Consolas, Menlo, monospace">03-mpc-nodes.yml</text>
<rect x="830" y="186" width="150" height="24" rx="12.0" fill="#ecfdf5" stroke="#059669" stroke-width="1.2"/>
<text x="905.0" y="202.5" font-size="12.5" fill="#064e3b" text-anchor="middle" font-weight="700">operator + 3 teams</text>
<text x="830" y="242" font-size="13.5" fill="#334155">handoff + cluster.json</text>
<text x="830" y="263" font-size="13.5" fill="#9f1239" font-weight="700">STOPS for the teams:</text>
<text x="830" y="284" font-size="13.5" fill="#334155">run site.yml again after</text>
<rect x="1072" y="118" width="230" height="196" rx="12" fill="#ecfdf5" stroke="#059669" stroke-width="2" filter="url(#sh)"/>
<text x="1088" y="152" font-size="22" fill="#064e3b" font-weight="700">04</text>
<text x="1122" y="151" font-size="15" fill="#064e3b" font-weight="700">Coordinators</text>
<text x="1088" y="174" font-size="12.5" fill="#64748b" font-family="'JetBrains Mono', Consolas, Menlo, monospace">04-coordinators.yml</text>
<rect x="1088" y="186" width="92" height="24" rx="12.0" fill="#ecfdf5" stroke="#059669" stroke-width="1.2"/>
<text x="1134.0" y="202.5" font-size="12.5" fill="#064e3b" text-anchor="middle" font-weight="700">.135, .136</text>
<text x="1088" y="242" font-size="13.5" fill="#334155">coord1 + coord2</text>
<text x="1088" y="263" font-size="13.5" fill="#334155">key ceremony → SENDER01</text>
<text x="1088" y="284" font-size="13.5" fill="#334155">presignature pool</text>
<rect x="1330" y="118" width="230" height="196" rx="12" fill="#faf5ff" stroke="#7c3aed" stroke-width="2" filter="url(#sh)"/>
