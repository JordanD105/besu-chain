<text x="58" y="365" font-size="12" fill="#64748b" text-anchor="start">admin PCs</text>
<rect x="1040" y="320" width="420" height="58" rx="12" fill="#ffffff" stroke="#0891b2" stroke-width="1.8"/>
<text x="1058" y="345" font-size="14" fill="#155e75" font-weight="700" text-anchor="start">chainlens :30100 + admin pages</text>
<text x="1058" y="365" font-size="12" fill="#64748b" text-anchor="start">Deploy / Sections, with token, while enabled</text>
<line x1="400" y1="349.0" x2="1036" y2="349.0" stroke="#0891b2" stroke-width="2" marker-end="url(#aC)"/>
<rect x="40" y="390" width="360" height="58" rx="12" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.8"/>
