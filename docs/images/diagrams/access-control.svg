<text x="58" y="225" font-size="12" fill="#64748b" text-anchor="start">applications</text>
<rect x="1040" y="180" width="420" height="58" rx="12" fill="#ffffff" stroke="#2563eb" stroke-width="1.8"/>
<text x="1058" y="205" font-size="14" fill="#1e3a8a" font-weight="700" text-anchor="start">proxy VIP 192.168.68.151:30000</text>
<text x="1058" y="225" font-size="12" fill="#64748b" text-anchor="start">the proxy API (HA pair)</text>
<line x1="400" y1="209.0" x2="1036" y2="209.0" stroke="#2563eb" stroke-width="2" marker-end="url(#aB)"/>
