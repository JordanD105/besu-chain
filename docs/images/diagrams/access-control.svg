<rect width="1500" height="992" fill="#f8fafc"/>
<text x="40" y="46" font-size="26" fill="#0f172a" font-weight="700" text-anchor="start">Who may reach which port</text>
<text x="40" y="72" font-size="15" fill="#475569" text-anchor="start">Each list in group_vars/all/settings.yml opens its service only to those addresses; everyone else is blocked</text>
<g transform="translate(0,20)">
<rect x="40" y="110" width="360" height="58" rx="12" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.8"/>
<text x="58" y="135" font-size="15" fill="#92400e" font-weight="700" text-anchor="start">operator_ip</text>
<text x="58" y="155" font-size="12" fill="#64748b" text-anchor="start">the operator / bastion (one address)</text>
<rect x="1040" y="110" width="420" height="58" rx="12" fill="#ffffff" stroke="#f59e0b" stroke-width="1.8"/>
<text x="1058" y="135" font-size="14" fill="#92400e" font-weight="700" text-anchor="start">SSH 22 on every host, Besu RPC 8545 / 8555,</text>
<text x="1058" y="155" font-size="12" fill="#64748b" text-anchor="start">MPC admin 9100, and every service below</text>
<line x1="400" y1="139.0" x2="1036" y2="139.0" stroke="#f59e0b" stroke-width="2" marker-end="url(#aY)"/>
<rect x="40" y="180" width="360" height="58" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="1.8"/>
