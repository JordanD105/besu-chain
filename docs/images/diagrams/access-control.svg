<text x="1058" y="275" font-size="14" fill="#155e75" font-weight="700" text-anchor="start">chainlens h139:30100</text>
<text x="1058" y="295" font-size="12" fill="#64748b" text-anchor="start">block explorer (no admin pages)</text>
