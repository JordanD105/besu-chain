<text x="58" y="575" font-size="12" fill="#64748b" text-anchor="start">documentation readers</text>
<rect x="1040" y="530" width="420" height="58" rx="12" fill="#ffffff" stroke="#94a3b8" stroke-width="1.8"/>
<text x="1058" y="555" font-size="14" fill="#334155" font-weight="700" text-anchor="start">documentation site h139:30300</text>
<text x="1058" y="575" font-size="12" fill="#64748b" text-anchor="start">this documentation</text>
<line x1="400" y1="559.0" x2="1036" y2="559.0" stroke="#94a3b8" stroke-width="2" marker-end="url(#aN)"/>
<rect x="40" y="600" width="360" height="58" rx="12" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.8"/>
<text x="58" y="625" font-size="15" fill="#92400e" font-weight="700" text-anchor="start">monitoring host h139</text>
<text x="58" y="645" font-size="12" fill="#64748b" text-anchor="start">fixed rule</text>
<rect x="1040" y="600" width="420" height="58" rx="12" fill="#ffffff" stroke="#f59e0b" stroke-width="1.8"/>
<text x="1058" y="625" font-size="14" fill="#92400e" font-weight="700" text-anchor="start">metrics: node-exporter 9101 (all hosts),</text>
<text x="1058" y="645" font-size="12" fill="#64748b" text-anchor="start">Besu 9545/9546, redis 9121, proxy 30000, RPC 8555, MPC 9100</text>
<line x1="400" y1="629.0" x2="1036" y2="629.0" stroke="#f59e0b" stroke-width="2" marker-end="url(#aY)"/>
<rect x="40" y="670" width="360" height="58" rx="12" fill="#faf5ff" stroke="#7c3aed" stroke-width="1.8"/>
<text x="58" y="695" font-size="15" fill="#4c1d95" font-weight="700" text-anchor="start">Besu hosts h135–h138</text>
<text x="58" y="715" font-size="12" fill="#64748b" text-anchor="start">fixed rule</text>
<rect x="1040" y="670" width="420" height="58" rx="12" fill="#ffffff" stroke="#7c3aed" stroke-width="1.8"/>
<text x="1058" y="695" font-size="14" fill="#4c1d95" font-weight="700" text-anchor="start">P2P 30303 (validators), 30304 (RPC nodes)</text>
<text x="1058" y="715" font-size="12" fill="#64748b" text-anchor="start">between the Besu hosts only</text>
