<text x="58" y="505" font-size="12" fill="#64748b" text-anchor="start">developers</text>
<rect x="1040" y="460" width="420" height="58" rx="12" fill="#ffffff" stroke="#94a3b8" stroke-width="1.8"/>
<text x="1058" y="485" font-size="14" fill="#334155" font-weight="700" text-anchor="start">Remix IDE h139:30200</text>
<text x="1058" y="505" font-size="12" fill="#64748b" text-anchor="start">self-hosted Remix</text>
<line x1="400" y1="489.0" x2="1036" y2="489.0" stroke="#94a3b8" stroke-width="2" marker-end="url(#aN)"/>
<rect x="40" y="530" width="360" height="58" rx="12" fill="#ffffff" stroke="#94a3b8" stroke-width="1.8"/>
