<text x="720" y="86" font-size="13" fill="#9f1239" font-weight="700" text-anchor="middle">firewall on every host</text>
<rect x="40" y="772" width="360" height="50" rx="12" fill="#ffffff" stroke="#e11d48" stroke-width="1.8" stroke-dasharray="6 4"/>
<text x="58" y="794" font-size="15" fill="#9f1239" font-weight="700" text-anchor="start">any other address</text>
<text x="58" y="812" font-size="12" fill="#64748b" text-anchor="start">not in a list</text>
<line x1="400" y1="797" x2="656" y2="797" stroke="#e11d48" stroke-width="2" marker-end="url(#aR)"/>
<text x="720" y="802" font-size="14" fill="#9f1239" font-weight="700" text-anchor="middle">blocked</text>
<rect x="40" y="848" width="700" height="94" rx="12" fill="#fff7ed" stroke="#ea580c" stroke-width="1.8"/>
<text x="58" y="874" font-size="15" fill="#9a3412" font-weight="700" text-anchor="start">Layer 1 · firewalld rich rules</text>
<text x="58" y="896" font-size="13" fill="#9a3412" text-anchor="start">ports of the host itself: SSH, HAProxy, Besu nodes with host</text>
<text x="58" y="915" font-size="13" fill="#9a3412" text-anchor="start">networking, VRRP between h135 and h136</text>
<text x="58" y="933" font-size="12" fill="#64748b" text-anchor="start">firewall-cmd --list-rich-rules</text>
<rect x="760" y="848" width="700" height="94" rx="12" fill="#fff7ed" stroke="#ea580c" stroke-width="1.8"/>
<text x="778" y="874" font-size="15" fill="#9a3412" font-weight="700" text-anchor="start">Layer 2 · nftables table inet besu_docker</text>
<text x="778" y="896" font-size="13" fill="#9a3412" text-anchor="start">ports Docker publishes (Docker forwards them past firewalld): proxy, coordinator,</text>
<text x="778" y="915" font-size="13" fill="#9a3412" text-anchor="start">MPC node, Grafana, chainlens, Remix, docs site, redis-exporter</text>
<text x="778" y="933" font-size="12" fill="#64748b" text-anchor="start">nft list table inet besu_docker · same allow lists as layer 1</text>
