<text x="58" y="435" font-size="12" fill="#64748b" text-anchor="start">dashboard users</text>
<rect x="1040" y="390" width="420" height="58" rx="12" fill="#ffffff" stroke="#f59e0b" stroke-width="1.8"/>
<text x="1058" y="415" font-size="14" fill="#92400e" font-weight="700" text-anchor="start">Grafana h139:3000</text>
<text x="1058" y="435" font-size="12" fill="#64748b" text-anchor="start">monitoring dashboards</text>
<line x1="400" y1="419.0" x2="1036" y2="419.0" stroke="#f59e0b" stroke-width="2" marker-end="url(#aY)"/>
<rect x="40" y="460" width="360" height="58" rx="12" fill="#ffffff" stroke="#94a3b8" stroke-width="1.8"/>
