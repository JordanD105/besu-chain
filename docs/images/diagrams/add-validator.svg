<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="640" viewBox="0 0 1500 640" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker><filter id="sh" x="-5%" y="-5%" width="110%" height="115%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.10"/></filter></defs>
<rect width="1500" height="640" fill="#f8fafc"/>
<text x="40" y="46" font-size="26" font-weight="700" fill="#0f172a">Adding a Besu validator with Ansible</text>
<text x="40" y="72" font-size="15" fill="#475569">The genesis never changes. Blocks keep coming during every step: nodes restart one at a time, and the new node only votes once it is voted in.</text>
<rect x="40" y="110" width="430" height="170" rx="14" fill="#ffffff" stroke="#64748b" stroke-width="2" filter="url(#sh)"/>
<circle cx="74" cy="144" r="15" fill="#64748b"/>
<text x="74" y="149" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">1</text>
<text x="100" y="150" font-size="18" font-weight="700" fill="#0f172a">Plan the node</text>
<text x="64" y="184" font-size="13" font-family="'JetBrains Mono', 'DejaVu Sans Mono', Consolas, monospace" fill="#334155">inventory.yml · layout.yml</text>
<text x="64" y="214" font-size="14" fill="#334155">a host of its own (h140)</text>
<text x="64" y="236" font-size="14" fill="#334155">add it to servers and besu_hosts</text>
<text x="64" y="258" font-size="14" fill="#334155">besu_nodes: val5, validator, :30303</text>
<rect x="525" y="110" width="430" height="170" rx="14" fill="#fffbeb" stroke="#d97706" stroke-width="2" filter="url(#sh)"/>
<circle cx="559" cy="144" r="15" fill="#d97706"/>
<text x="559" y="149" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">2</text>
<text x="585" y="150" font-size="18" font-weight="700" fill="#92400e">Prepare the hosts</text>
<text x="549" y="184" font-size="13" font-family="'JetBrains Mono', 'DejaVu Sans Mono', Consolas, monospace" fill="#334155">00-preflight 01-hosts 02-images</text>
<text x="549" y="214" font-size="14" fill="#334155">ALL hosts: firewall lets the new host</text>
<text x="549" y="236" font-size="14" fill="#334155">reach P2P 30303 on every Besu host</text>
<text x="549" y="258" font-size="14" fill="#334155">the new host gets Docker and Besu</text>
<rect x="1010" y="110" width="430" height="170" rx="14" fill="#faf5ff" stroke="#7c3aed" stroke-width="2" filter="url(#sh)"/>
<circle cx="1044" cy="144" r="15" fill="#7c3aed"/>
<text x="1044" y="149" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">3</text>
<text x="1070" y="150" font-size="18" font-weight="700" fill="#4c1d95">Join the network</text>
<text x="1034" y="184" font-size="13" font-family="'JetBrains Mono', 'DejaVu Sans Mono', Consolas, monospace" fill="#334155">05-besu.yml</text>
<text x="1034" y="214" font-size="14" fill="#334155">key created on the new host</text>
<text x="1034" y="236" font-size="14" fill="#334155">add-node.sh: its enode into the files</text>
<text x="1034" y="258" font-size="14" fill="#334155">every node restarted, one at a time</text>
<rect x="40" y="345" width="430" height="170" rx="14" fill="#ecfdf5" stroke="#059669" stroke-width="2" filter="url(#sh)"/>
<circle cx="74" cy="379" r="15" fill="#059669"/>
<text x="74" y="384" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">4</text>
<text x="100" y="385" font-size="18" font-weight="700" fill="#065f46">Vote it in</text>
<text x="64" y="419" font-size="13" font-family="'JetBrains Mono', 'DejaVu Sans Mono', Consolas, monospace" fill="#334155">qbft-vote.yml -e node=val5 -e vote=add</text>
<text x="64" y="449" font-size="14" fill="#334155">every validator votes; more than half</text>
<text x="64" y="471" font-size="14" fill="#334155">is enough, then the votes are withdrawn</text>
<text x="64" y="493" font-size="14" fill="#334155">"5 validators; val5 is one of them"</text>
<rect x="525" y="345" width="430" height="170" rx="14" fill="#ecfeff" stroke="#0891b2" stroke-width="2" filter="url(#sh)"/>
<circle cx="559" cy="379" r="15" fill="#0891b2"/>
<text x="559" y="384" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">5</text>
<text x="585" y="385" font-size="18" font-weight="700" fill="#155e75">Monitor and back up</text>
<text x="549" y="419" font-size="13" font-family="'JetBrains Mono', 'DejaVu Sans Mono', Consolas, monospace" fill="#334155">09-monitoring 10-backups</text>
<text x="549" y="449" font-size="14" fill="#334155">Prometheus scrapes val5</text>
<text x="549" y="471" font-size="14" fill="#334155">Validators expected = 5</text>
<text x="549" y="493" font-size="14" fill="#334155">its key: GPG backup to the operator</text>
<rect x="1010" y="345" width="430" height="170" rx="14" fill="#f0fdf4" stroke="#16a34a" stroke-width="2" filter="url(#sh)"/>
<circle cx="1044" cy="379" r="15" fill="#16a34a"/>
<text x="1044" y="384" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">6</text>
<text x="1070" y="385" font-size="18" font-weight="700" fill="#14532d">Check</text>
<text x="1034" y="419" font-size="13" font-family="'JetBrains Mono', 'DejaVu Sans Mono', Consolas, monospace" fill="#334155">Grafana · qbft.sh</text>
<text x="1034" y="449" font-size="14" fill="#334155">Validators up = expected, peers = n-1</text>
<text x="1034" y="471" font-size="14" fill="#334155">val5 proposes blocks in turn</text>
<text x="1034" y="493" font-size="14" fill="#334155">BesuUnpermittedPeers (info) clears in 10 min</text>
<line x1="474" y1="195.0" x2="519" y2="195.0" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>
<line x1="959" y1="195.0" x2="1004" y2="195.0" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>
<line x1="474" y1="430.0" x2="519" y2="430.0" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>
<line x1="959" y1="430.0" x2="1004" y2="430.0" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>
<path d="M1225.0,284 V312.5 H255.0 V339" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>
<rect x="40" y="548" width="1420" height="62" rx="12" fill="#fff1f2" stroke="#e11d48" stroke-width="1.5"/>
<text x="60" y="574" font-size="15" font-weight="700" fill="#9f1239">Removing a validator is the reverse:</text>
<text x="60" y="596" font-size="14" fill="#881337">qbft-vote.yml vote=remove  →  remove-node.sh  →  delete it from layout.yml  →  05-besu.yml, 09-monitoring.yml, 01-hosts.yml  →  docker compose down on its host</text>
</svg>