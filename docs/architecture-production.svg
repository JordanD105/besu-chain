<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1200" viewBox="0 0 1600 1200" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker>
    <marker id="aG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#059669"/></marker>
    <marker id="aP" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/></marker>
    <marker id="aC" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0891b2"/></marker>
    <filter id="sh" x="-5%" y="-5%" width="110%" height="115%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.10"/></filter>
  </defs>
  <rect width="1600" height="1200" fill="#f8fafc"/>

  <text x="40" y="50" font-size="30" font-weight="700" fill="#0f172a">besu-chain: production architecture</text>
  <text x="40" y="80" font-size="15.5" fill="#475569">Zoned network · non-exportable MPC signing across 3 sites and 3 admin teams · only the API gateway is public</text>

  <!-- ===================== zone bands ===================== -->
  <rect x="40" y="100" width="1140" height="96" rx="14" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="56" y="122" font-size="12" font-weight="700" fill="#475569" letter-spacing="1">PUBLIC EDGE</text>
  <rect x="40" y="210" width="1140" height="226" rx="14" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="56" y="232" font-size="12" font-weight="700" fill="#1d4ed8" letter-spacing="1">APP ZONE · private subnets, ≥2 availability zones</text>
  <rect x="40" y="450" width="1140" height="270" rx="14" fill="#ecfdf5" stroke="#a7f3d0"/>
  <text x="56" y="472" font-size="12" font-weight="700" fill="#047857" letter-spacing="1">SIGNING ZONE · isolated, private network + firewall</text>
  <rect x="40" y="734" width="1140" height="236" rx="14" fill="#faf5ff" stroke="#ddd6fe"/>
  <text x="56" y="756" font-size="12" font-weight="700" fill="#6d28d9" letter-spacing="1">CHAIN ZONE · Besu QBFT</text>

  <!-- ===================== edge ===================== -->
  <g filter="url(#sh)"><rect x="60" y="130" width="230" height="56" rx="10" fill="#ffffff" stroke="#94a3b8"/></g>
  <text x="76" y="154" font-size="15" font-weight="700" fill="#0f172a">Clients</text>
  <text x="76" y="174" font-size="12.5" fill="#475569">apps · partners · browsers</text>
  <line x1="290" y1="158" x2="346" y2="158" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>
  <text x="298" y="150" font-size="11.5" fill="#334155">HTTPS</text>
  <g filter="url(#sh)"><rect x="350" y="130" width="810" height="56" rx="10" fill="#ffffff" stroke="#64748b" stroke-width="1.5"/></g>
  <text x="366" y="154" font-size="15" font-weight="700" fill="#0f172a">L7 load balancer / API gateway (HA pair)</text>
  <text x="366" y="174" font-size="12.5" fill="#475569">TLS 1.3 · client auth (API key / OAuth2 / mTLS) · per-client rate limits · WAF · only public entry point</text>

  <!-- ===================== app zone ===================== -->
  <g filter="url(#sh)"><rect x="60" y="244" width="440" height="180" rx="12" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/></g>
  <text x="76" y="270" font-size="16" font-weight="700" fill="#1e3a8a">proxy API</text>
  <text x="166" y="270" font-size="12.5" fill="#1d4ed8">1 active replica + standby</text>
  <text x="76" y="294" font-size="12.5" fill="#334155">/createaccount · /transfer · /nft/* (deploy, mint, buy)</text>
  <text x="76" y="314" font-size="12.5" fill="#334155">accounts = MPC keys · nonces = max(cache, chain)</text>
  <rect x="76" y="326" width="408" height="86" rx="8" fill="#fff7ed" stroke="#fdba74"/>
  <text x="88" y="346" font-size="12.5" font-weight="700" fill="#9a3412">Before running N &gt; 1 active replicas</text>
  <text x="88" y="365" font-size="12" fill="#7c2d12">• per-sender lock is in process memory (withSenderLock):</text>
  <text x="88" y="383" font-size="12" fill="#7c2d12">  move it to Redis, then scale out</text>
  <text x="88" y="401" font-size="12" fill="#7c2d12">• done: nonce resync, MPC accounts, Redis optional</text>

  <g filter="url(#sh)"><rect x="520" y="244" width="290" height="180" rx="12" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/></g>
  <text x="536" y="270" font-size="16" font-weight="700" fill="#1e3a8a">Redis (cache)</text>
  <text x="536" y="294" font-size="12.5" fill="#334155">single instance, no replica</text>
  <text x="536" y="314" font-size="12.5" fill="#334155">AOF on, AUTH, private network</text>
  <text x="536" y="334" font-size="12.5" fill="#334155">optional for correctness</text>
  <text x="536" y="358" font-size="12" fill="#64748b">down / empty / stale: proxy uses</text>
  <text x="536" y="376" font-size="12" fill="#64748b">memory + chain (nonces, prices,</text>
  <text x="536" y="400" font-size="12" fill="#64748b">collections, NFT metadata)</text>

  <g filter="url(#sh)"><rect x="830" y="244" width="330" height="180" rx="12" fill="#ffffff" stroke="#0891b2" stroke-width="1.5"/></g>
  <text x="846" y="270" font-size="16" font-weight="700" fill="#155e75">chainlens/ × 2</text>
  <text x="846" y="294" font-size="12.5" fill="#334155">block explorer, read-only</text>
  <text x="846" y="314" font-size="12.5" fill="#334155">behind the gateway (auth if private)</text>
  <text x="846" y="334" font-size="12.5" fill="#334155">in-memory index, rebuilt on start</text>
  <text x="846" y="358" font-size="12" fill="#64748b">reads its own read-only RPC node,</text>
  <text x="846" y="376" font-size="12" fill="#64748b">never the transaction path</text>

  <!-- edge -> app -->
  <line x1="450" y1="186" x2="450" y2="240" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>
  <line x1="995" y1="186" x2="995" y2="240" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>
  <line x1="500" y1="290" x2="516" y2="290" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>

  <!-- ===================== signing zone ===================== -->
  <g filter="url(#sh)"><rect x="60" y="484" width="340" height="200" rx="12" fill="#ffffff" stroke="#059669" stroke-width="2"/></g>
  <text x="76" y="510" font-size="16" font-weight="700" fill="#064e3b">mpc-coordinator × 2</text>
  <text x="76" y="530" font-size="12.5" fill="#047857">internal LB · stateless · no key material</text>
  <text x="76" y="554" font-size="12.5" fill="#334155">Web3Signer-compatible JSON-RPC</text>
  <text x="76" y="574" font-size="12.5" fill="#334155">presignature pool per hot key</text>
  <text x="76" y="594" font-size="12.5" fill="#334155">relay for MPC protocol messages</text>
  <text x="76" y="618" font-size="12" fill="#64748b">admin API only from bastion (DKG, pool)</text>
  <text x="76" y="638" font-size="12" fill="#64748b">pool sized for peak bursts;</text>
  <text x="76" y="656" font-size="12" fill="#64748b">sustained TPS = presign rate</text>

  <!-- proxy -> coordinator -->
  <line x1="360" y1="424" x2="360" y2="480" stroke="#059669" stroke-width="2" marker-end="url(#aG)"/>
  <text x="352" y="446" font-size="11.5" fill="#047857" text-anchor="end">eth_sendTransaction</text>
  <text x="352" y="461" font-size="11.5" fill="#047857" text-anchor="end">(private net)</text>

  <!-- 3 MPC nodes -->
  <g font-size="12.5">
    <g filter="url(#sh)"><rect x="430" y="484" width="235" height="200" rx="12" fill="#ffffff" stroke="#059669" stroke-width="2"/></g>
    <text x="446" y="510" font-size="15" font-weight="700" fill="#064e3b">mpc-node 0</text>
    <text x="446" y="530" fill="#047857">Site A · admin team A</text>
    <rect x="446" y="540" width="203" height="24" rx="6" fill="#fffbeb" stroke="#f59e0b"/>
    <text x="456" y="557" font-weight="700" fill="#92400e">key share x₀ (sealed)</text>
    <text x="446" y="584" fill="#334155">passphrase: site secret mgr / TPM</text>
    <text x="446" y="604" fill="#334155">policy: chain id, limits, allowlist</text>
    <text x="446" y="624" fill="#334155">encrypted backup → team A only</text>
    <text x="446" y="648" font-size="12" fill="#64748b">dedicated host, sized for</text>
    <text x="446" y="666" font-size="12" fill="#64748b">≈0.4 core per sustained TPS</text>

    <g filter="url(#sh)"><rect x="680" y="484" width="235" height="200" rx="12" fill="#ffffff" stroke="#059669" stroke-width="2"/></g>
    <text x="696" y="510" font-size="15" font-weight="700" fill="#064e3b">mpc-node 1</text>
    <text x="696" y="530" fill="#047857">Site B · admin team B</text>
    <rect x="696" y="540" width="203" height="24" rx="6" fill="#fffbeb" stroke="#f59e0b"/>
    <text x="706" y="557" font-weight="700" fill="#92400e">key share x₁ (sealed)</text>
    <text x="696" y="584" fill="#334155">passphrase: site secret mgr / TPM</text>
    <text x="696" y="604" fill="#334155">policy: chain id, limits, allowlist</text>
    <text x="696" y="624" fill="#334155">encrypted backup → team B only</text>
    <text x="696" y="648" font-size="12" fill="#64748b">dedicated host, sized for</text>
    <text x="696" y="666" font-size="12" fill="#64748b">≈0.4 core per sustained TPS</text>

    <g filter="url(#sh)"><rect x="930" y="484" width="230" height="200" rx="12" fill="#ffffff" stroke="#059669" stroke-width="2"/></g>
    <text x="946" y="510" font-size="15" font-weight="700" fill="#064e3b">mpc-node 2</text>
    <text x="946" y="530" fill="#047857">Site C · admin team C</text>
    <rect x="946" y="540" width="198" height="24" rx="6" fill="#fffbeb" stroke="#f59e0b"/>
    <text x="956" y="557" font-weight="700" fill="#92400e">key share x₂ (sealed)</text>
    <text x="946" y="584" fill="#334155">passphrase: site secret mgr / TPM</text>
    <text x="946" y="604" fill="#334155">policy: chain id, limits, allowlist</text>
    <text x="946" y="624" fill="#334155">encrypted backup → team C only</text>
    <text x="946" y="648" font-size="12" fill="#64748b">dedicated host, sized for</text>
    <text x="946" y="666" font-size="12" fill="#64748b">≈0.4 core per sustained TPS</text>
  </g>
  <!-- coordinator <-> nodes bus -->
  <g stroke="#059669" stroke-width="2" fill="none">
    <path d="M 400 600 L 418 600 L 418 700 L 1045 700"/>
    <path d="M 547 700 L 547 688" marker-end="url(#aG)"/>
    <path d="M 797 700 L 797 688" marker-end="url(#aG)"/>
    <path d="M 1045 700 L 1045 688" marker-end="url(#aG)"/>
  </g>
  <text x="560" y="714" font-size="11.5" fill="#047857">node API + relay over the private network (MPC msgs signed + encrypted) · any 2 of 3 sign</text>

  <!-- ===================== chain zone ===================== -->
  <g filter="url(#sh)"><rect x="60" y="768" width="340" height="190" rx="12" fill="#ffffff" stroke="#7c3aed" stroke-width="1.5"/></g>
  <text x="76" y="794" font-size="16" font-weight="700" fill="#4c1d95">RPC nodes × 2+ (internal LB)</text>
  <text x="76" y="818" font-size="12.5" fill="#334155">tx submission + reads for proxy / signer</text>
  <text x="76" y="838" font-size="12.5" fill="#334155">APIs: ETH, NET, WEB3, TXPOOL only</text>
  <text x="76" y="858" font-size="12.5" fill="#334155">no ADMIN / DEBUG / TRACE / PERM</text>
  <text x="76" y="878" font-size="12.5" fill="#334155">host allowlist + CORS restricted</text>
  <text x="76" y="902" font-size="12" fill="#64748b">non-validating, full sync, one per AZ;</text>
  <text x="76" y="920" font-size="12" fill="#64748b">TX pool limits sized for peak load</text>

  <!-- coordinator -> rpc; proxy reads -> rpc -->
  <line x1="360" y1="684" x2="360" y2="764" stroke="#7c3aed" stroke-width="2" marker-end="url(#aP)"/>
  <text x="352" y="742" font-size="11.5" fill="#6d28d9" text-anchor="end">signed raw tx</text>

  <g filter="url(#sh)"><rect x="440" y="768" width="520" height="190" rx="12" fill="#ffffff" stroke="#7c3aed" stroke-width="1.5"/></g>
  <text x="456" y="794" font-size="16" font-weight="700" fill="#4c1d95">QBFT validators (4, one per failure domain)</text>
  <g font-size="12.5" font-weight="600" fill="#ffffff">
    <rect x="456" y="808" width="114" height="44" rx="8" fill="#7c3aed"/><text x="513" y="827" text-anchor="middle">validator 1</text><text x="513" y="844" text-anchor="middle" font-weight="400" font-size="11.5">AZ / site A</text>
    <rect x="580" y="808" width="114" height="44" rx="8" fill="#7c3aed"/><text x="637" y="827" text-anchor="middle">validator 2</text><text x="637" y="844" text-anchor="middle" font-weight="400" font-size="11.5">AZ / site B</text>
    <rect x="704" y="808" width="114" height="44" rx="8" fill="#7c3aed"/><text x="761" y="827" text-anchor="middle">validator 3</text><text x="761" y="844" text-anchor="middle" font-weight="400" font-size="11.5">AZ / site C</text>
    <rect x="828" y="808" width="114" height="44" rx="8" fill="#7c3aed"/><text x="885" y="827" text-anchor="middle">validator 4</text><text x="885" y="844" text-anchor="middle" font-weight="400" font-size="11.5">AZ / site D</text>
  </g>
  <text x="456" y="878" font-size="12.5" fill="#334155">p2p only (no client RPC) · node permissioning allowlist</text>
  <text x="456" y="898" font-size="12.5" fill="#334155">node keys generated on each host, backed up per team</text>
  <text x="456" y="922" font-size="12" fill="#64748b">4 validators tolerate 1 failure (quorum 3); one per domain so a site</text>
  <text x="456" y="940" font-size="12" fill="#64748b">outage costs one vote · grow to 7 validators (QBFT vote) to tolerate 2</text>
  <line x1="400" y1="830" x2="436" y2="830" stroke="#7c3aed" stroke-width="2" marker-end="url(#aP)" marker-start="url(#aP)"/>
  <text x="404" y="822" font-size="11" fill="#6d28d9">p2p</text>

  <g filter="url(#sh)"><rect x="980" y="768" width="180" height="190" rx="12" fill="#ffffff" stroke="#0891b2" stroke-width="1.5"/></g>
  <text x="996" y="794" font-size="15" font-weight="700" fill="#155e75">Read-only RPC</text>
  <text x="996" y="814" font-size="15" font-weight="700" fill="#155e75">for explorer</text>
  <text x="996" y="840" font-size="12.5" fill="#334155">isolates explorer</text>
  <text x="996" y="860" font-size="12.5" fill="#334155">polling from the</text>
  <text x="996" y="880" font-size="12.5" fill="#334155">transaction path</text>
  <text x="996" y="906" font-size="12" fill="#64748b">ETH, NET, WEB3</text>
  <line x1="960" y1="900" x2="976" y2="900" stroke="#7c3aed" stroke-width="2" marker-end="url(#aP)" marker-start="url(#aP)"/>
  <!-- chainlens -> read RPC -->
  <path d="M 1160 300 L 1172 300 L 1172 860 L 1164 860" stroke="#0891b2" stroke-width="2" fill="none" marker-end="url(#aC)"/>

  <!-- ===================== cross-cutting column ===================== -->
  <g filter="url(#sh)"><rect x="1200" y="100" width="360" height="400" rx="14" fill="#ffffff" stroke="#f59e0b" stroke-width="1.5"/></g>
  <text x="1218" y="128" font-size="16" font-weight="700" fill="#92400e">Observability &amp; alerting</text>
  <g font-size="12.5" fill="#334155">
    <text x="1218" y="154">Prometheus (+ remote storage) → Alertmanager</text>
    <text x="1218" y="174">→ on-call (PagerDuty / Slack / email)</text>
    <text x="1218" y="198">Grafana: Besu, proxy, Redis, MPC dashboards</text>
    <text x="1218" y="222">Loki ← Alloy: logs from every tier</text>
    <text x="1218" y="246">Tempo ← OpenTelemetry: request traces</text>
    <text x="1218" y="274" font-weight="700" fill="#92400e">Alert on</text>
    <text x="1218" y="296">• block production stalled / validator offline</text>
    <text x="1218" y="316">• peers &lt; expected · tx pool backlog</text>
    <text x="1218" y="336">• presignature pool below low-water mark</text>
    <text x="1218" y="356">• MPC node down (2 of 3 left = no redundancy)</text>
    <text x="1218" y="376">• signing errors / policy refusals spike</text>
    <text x="1218" y="396">• Redis unreachable (warning) · 5xx at gateway</text>
    <text x="1218" y="420">• disk, CPU, certificate expiry</text>
    <text x="1218" y="456" font-size="12" fill="#64748b">Monitoring runs in its own zone; it scrapes</text>
    <text x="1218" y="474" font-size="12" fill="#64748b">metrics but cannot call signing APIs</text>
  </g>

  <g filter="url(#sh)"><rect x="1200" y="516" width="360" height="454" rx="14" fill="#ffffff" stroke="#64748b" stroke-width="1.5"/></g>
  <text x="1218" y="544" font-size="16" font-weight="700" fill="#0f172a">Security &amp; operations</text>
  <g font-size="12.5" fill="#334155">
    <text x="1218" y="570" font-weight="700">Secrets</text>
    <text x="1218" y="590">one secret store per site/team (MPC</text>
    <text x="1218" y="608">passphrases, node keys); no shared</text>
    <text x="1218" y="626">secret gives access to 2 MPC nodes</text>
    <text x="1218" y="652" font-weight="700">Access</text>
    <text x="1218" y="672">bastion + MFA per zone; no SSH from</text>
    <text x="1218" y="690">app zone into signing or chain zones</text>
    <text x="1218" y="716" font-weight="700">Supply chain</text>
    <text x="1218" y="736">CI builds pinned, signed images (incl.</text>
    <text x="1218" y="754">cggmp24 version); deploy per zone</text>
    <text x="1218" y="780" font-weight="700">Backups &amp; DR</text>
    <text x="1218" y="800">Besu data snapshots per AZ · validator</text>
    <text x="1218" y="818">keys escrowed · MPC shares backed up</text>
    <text x="1218" y="836">separately by each team · restore drills</text>
    <text x="1218" y="862" font-weight="700">Audit</text>
    <text x="1218" y="882">gateway, coordinator and every MPC node</text>
    <text x="1218" y="900">log each request → append-only / SIEM</text>
    <text x="1218" y="926" font-weight="700">Retired</text>
    <text x="1218" y="946">Vault-stored private keys + Web3Signer</text>
  </g>

  <!-- ===================== footer ===================== -->
  <g transform="translate(40,990)">
    <rect width="1520" height="190" rx="14" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="20" y="32" font-size="16" font-weight="700" fill="#0f172a">Request path (POST /transfer) and failure tolerance</text>
    <g font-size="13" fill="#334155">
      <text x="20" y="62">1. client → API gateway (TLS, auth, rate limit) → proxy</text>
      <text x="20" y="84">2. proxy: sender lock, nonce = max(cache, chain), balance check incl. pending</text>
      <text x="20" y="106">3. proxy → mpc-coordinator eth_sendTransaction</text>
      <text x="20" y="128">4. coordinator → 2 MPC nodes: policy + partial signature (presignature)</text>
      <text x="20" y="150">5. combined signature → RPC LB → validators (QBFT, ~1 s block)</text>
      <text x="20" y="172">6. proxy returns tx hash; chainlens shows it after its next poll</text>
      <text x="780" y="62" font-weight="700" fill="#0f172a">Survives without downtime</text>
      <text x="780" y="84">• any 1 coordinator or RPC node · Redis down (proxy: memory + chain)</text>
      <text x="780" y="106">• any 1 MPC node / site / admin team (2-of-3 still signs)</text>
      <text x="780" y="128">• any 1 validator (4 validators, quorum 3)</text>
      <text x="780" y="150">• theft of 1 MPC node, disk or backup: no key, no signing</text>
      <text x="780" y="172" fill="#64748b">Test setup (single host, all ports open): see "Development / test environment" in README</text>
    </g>
  </g>
</svg>
