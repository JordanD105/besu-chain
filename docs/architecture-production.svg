<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1160" viewBox="0 0 1600 1160" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker>
    <marker id="aG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#059669"/></marker>
    <marker id="aP" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/></marker>
    <marker id="aB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker>
    <filter id="sh" x="-5%" y="-5%" width="110%" height="115%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.10"/></filter>
  </defs>
  <rect width="1600" height="1160" fill="#f8fafc"/>

  <text x="40" y="50" font-size="30" font-weight="700" fill="#0f172a">besu-chain: production layout (5 hosts)</text>
  <text x="40" y="80" font-size="15.5" fill="#475569">Any one host can fail: 4 validators (quorum 3) and 3 MPC nodes (2 of 3) on separate hosts · the application path fails over from .135 to .136</text>

  <!-- ===================== entry ===================== -->
  <rect x="560" y="104" width="480" height="58" rx="12" fill="#ffffff" stroke="#94a3b8" filter="url(#sh)"/>
  <text x="800" y="128" font-size="16" font-weight="700" fill="#0f172a" text-anchor="middle">Applications → API gateway (bring your own)</text>
  <text x="800" y="149" font-size="13" fill="#475569" text-anchor="middle">TLS · client auth · rate limits — the only public entry</text>

  <rect x="610" y="190" width="380" height="44" rx="22" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
  <text x="800" y="218" font-size="15" font-weight="700" fill="#065f46" text-anchor="middle">VIP 192.168.68.151 : 30000  (proxy)</text>
  <line x1="800" y1="162" x2="800" y2="188" stroke="#059669" stroke-width="2.2" marker-end="url(#aG)"/>

  <!-- ===================== host .135 ===================== -->
  <rect x="40" y="262" width="740" height="420" rx="16" fill="#ffffff" stroke="#334155" stroke-width="2" filter="url(#sh)"/>
  <text x="60" y="292" font-size="19" font-weight="700" fill="#0f172a">192.168.68.135</text>
  <text x="235" y="292" font-size="14" fill="#475569">primary application host · keepalived MASTER (priority 150)</text>

  <!-- ===================== host .136 ===================== -->
  <rect x="820" y="262" width="740" height="420" rx="16" fill="#ffffff" stroke="#334155" stroke-width="2" stroke-dasharray="9 5" filter="url(#sh)"/>
  <text x="840" y="292" font-size="19" font-weight="700" fill="#0f172a">192.168.68.136</text>
  <text x="1015" y="292" font-size="14" fill="#475569">standby application host · keepalived BACKUP (100)</text>

  <!-- VRRP link -->
  <line x1="781" y1="330" x2="819" y2="330" stroke="#64748b" stroke-width="2" stroke-dasharray="4 3"/>
  <text x="800" y="318" font-size="11" fill="#475569" text-anchor="middle">VRRP</text>

  <!-- proxies -->
  <rect x="64" y="312" width="320" height="64" rx="10" fill="#ecfdf5" stroke="#059669" stroke-width="1.6"/>
  <text x="80" y="338" font-size="15" font-weight="700" fill="#065f46">proxy1  :30000  ACTIVE</text>
  <text x="80" y="360" font-size="12.5" fill="#065f46">holds the VIP .151 · nonces from the chain</text>
  <rect x="844" y="312" width="320" height="64" rx="10" fill="#f8fafc" stroke="#059669" stroke-width="1.6" stroke-dasharray="7 4"/>
  <text x="860" y="338" font-size="15" font-weight="700" fill="#065f46">proxy2  STANDBY (stopped)</text>
  <text x="860" y="360" font-size="12.5" fill="#065f46">keepalived starts it when it takes .151</text>
  <path d="M610,212 H224 V310" fill="none" stroke="#059669" stroke-width="2.2" marker-end="url(#aG)"/>
  <path d="M990,212 H1004 V310" fill="none" stroke="#059669" stroke-width="1.8" stroke-dasharray="7 4" marker-end="url(#aG)"/>

  <!-- HAProxy -->
  <rect x="420" y="312" width="340" height="64" rx="10" fill="#fff7ed" stroke="#ea580c" stroke-width="1.6"/>
  <text x="436" y="338" font-size="15" font-weight="700" fill="#9a3412">HAProxy · VIP 192.168.68.150</text>
  <text x="436" y="360" font-size="12.5" fill="#9a3412">:8545 → rpc1:8555 (rpc2)  ·  :9100 → coord1 (coord2)</text>
  <rect x="1200" y="312" width="340" height="64" rx="10" fill="#fff7ed" stroke="#ea580c" stroke-width="1.6" stroke-dasharray="7 4"/>
  <text x="1216" y="338" font-size="15" font-weight="700" fill="#9a3412">HAProxy (takes VIP .150 on failover)</text>
  <text x="1216" y="360" font-size="12.5" fill="#9a3412">same configuration as on .135</text>
  <line x1="386" y1="344" x2="418" y2="344" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>

  <!-- coordinators -->
  <rect x="64" y="404" width="330" height="70" rx="10" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.6"/>
  <text x="80" y="431" font-size="15" font-weight="700" fill="#5b21b6">coord1  :9100  (MPC coordinator)</text>
  <text x="80" y="453" font-size="12.5" fill="#5b21b6">no key material · presignature pool · relay</text>
  <rect x="844" y="404" width="330" height="70" rx="10" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.6" stroke-dasharray="7 4"/>
  <text x="860" y="431" font-size="15" font-weight="700" fill="#5b21b6">coord2  :9100  WARM STANDBY</text>
  <text x="860" y="453" font-size="12.5" fill="#5b21b6">own pool full · re-reads keys from the nodes</text>

  <!-- rpc nodes -->
  <rect x="420" y="404" width="340" height="70" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"/>
  <text x="436" y="431" font-size="15" font-weight="700" fill="#1e40af">rpc1  :8555  (Besu RPC node)</text>
  <text x="436" y="453" font-size="12.5" fill="#1e40af">p2p 30304 · metrics 9546 · TXPOOL API</text>
  <rect x="1200" y="404" width="340" height="70" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6" stroke-dasharray="7 4"/>
  <text x="1216" y="431" font-size="15" font-weight="700" fill="#1e40af">rpc2  :8555  (backup, chainlens)</text>
  <text x="1216" y="453" font-size="12.5" fill="#1e40af">p2p 30304 · metrics 9546</text>

  <line x1="520" y1="378" x2="320" y2="402" stroke="#7c3aed" stroke-width="2" marker-end="url(#aP)"/>
  <line x1="600" y1="378" x2="600" y2="402" stroke="#2563eb" stroke-width="2" marker-end="url(#aB)"/>
  <line x1="700" y1="378" x2="1010" y2="402" stroke="#7c3aed" stroke-width="1.6" stroke-dasharray="7 4" marker-end="url(#aP)"/>
  <line x1="740" y1="378" x2="1300" y2="402" stroke="#2563eb" stroke-width="1.6" stroke-dasharray="7 4" marker-end="url(#aB)"/>

  <!-- validators and mpc on .135/.136 -->
  <rect x="64" y="502" width="330" height="70" rx="10" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.6"/>
  <text x="80" y="529" font-size="15" font-weight="700" fill="#1e3a8a">val1  (QBFT validator)</text>
  <text x="80" y="551" font-size="12.5" fill="#1e3a8a">p2p 30303 · RPC 127.0.0.1:8645 · metrics 9545</text>
  <rect x="420" y="502" width="340" height="70" rx="10" fill="#ede9fe" stroke="#6d28d9" stroke-width="1.6"/>
  <text x="436" y="529" font-size="15" font-weight="700" fill="#4c1d95">mpc1  (MPC node 0, team A)</text>
  <text x="436" y="551" font-size="12.5" fill="#4c1d95">one key share, sealed · :7000</text>
  <rect x="844" y="502" width="330" height="70" rx="10" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.6"/>
  <text x="860" y="529" font-size="15" font-weight="700" fill="#1e3a8a">val2  (QBFT validator)</text>
  <text x="860" y="551" font-size="12.5" fill="#1e3a8a">p2p 30303 · RPC 127.0.0.1:8645 · metrics 9545</text>

  <text x="64" y="606" font-size="13" fill="#475569">Also on each host: node-exporter :9101, backups (keys; mpc1 hourly share backup)</text>
  <text x="64" y="628" font-size="13" fill="#475569">Two Besu nodes per host → host networking (docker-compose.host.yml), own ports</text>
  <text x="844" y="606" font-size="13" fill="#475569">Same proxy .env and image as .135 · HAProxy, keepalived</text>
  <text x="844" y="628" font-size="13" fill="#475569">No MPC node here: .136 holds no key share</text>
  <text x="844" y="660" font-size="12.5" fill="#64748b">Dashed arrows from HAProxy: backup paths when coord1 / rpc1 fail</text>
  <text x="64" y="660" font-size="12.5" fill="#64748b">keepalived moves .150 if HAProxy fails, .151 if the proxy fails (then starts proxy2, stops proxy1)</text>

  <!-- ===================== hosts .137 .138 .139 ===================== -->
  <rect x="40" y="712" width="470" height="210" rx="16" fill="#ffffff" stroke="#334155" stroke-width="2" filter="url(#sh)"/>
  <text x="60" y="742" font-size="19" font-weight="700" fill="#0f172a">192.168.68.137</text>
  <rect x="64" y="760" width="200" height="70" rx="10" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.6"/>
  <text x="80" y="787" font-size="15" font-weight="700" fill="#1e3a8a">val3</text>
  <text x="80" y="809" font-size="12.5" fill="#1e3a8a">daily chain snapshot</text>
  <rect x="284" y="760" width="200" height="70" rx="10" fill="#ede9fe" stroke="#6d28d9" stroke-width="1.6"/>
  <text x="300" y="787" font-size="15" font-weight="700" fill="#4c1d95">mpc2 (node 1, team B)</text>
  <text x="300" y="809" font-size="12.5" fill="#4c1d95">hourly share backup</text>
  <text x="64" y="860" font-size="13" fill="#475569">p2p 30303 · metrics 9545 · :7000 · :9101</text>
  <text x="64" y="884" font-size="13" fill="#475569">validator RPC on 127.0.0.1 only</text>

  <rect x="565" y="712" width="470" height="210" rx="16" fill="#ffffff" stroke="#334155" stroke-width="2" filter="url(#sh)"/>
  <text x="585" y="742" font-size="19" font-weight="700" fill="#0f172a">192.168.68.138</text>
  <rect x="589" y="760" width="200" height="70" rx="10" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.6"/>
  <text x="605" y="787" font-size="15" font-weight="700" fill="#1e3a8a">val4</text>
  <text x="605" y="809" font-size="12.5" fill="#1e3a8a">QBFT validator</text>
  <rect x="809" y="760" width="200" height="70" rx="10" fill="#ede9fe" stroke="#6d28d9" stroke-width="1.6"/>
  <text x="825" y="787" font-size="15" font-weight="700" fill="#4c1d95">mpc3 (node 2, team C)</text>
  <text x="825" y="809" font-size="12.5" fill="#4c1d95">hourly share backup</text>
  <text x="589" y="860" font-size="13" fill="#475569">p2p 30303 · metrics 9545 · :7000 · :9101</text>
  <text x="589" y="884" font-size="13" fill="#475569">validator RPC on 127.0.0.1 only</text>

  <rect x="1090" y="712" width="470" height="210" rx="16" fill="#ffffff" stroke="#334155" stroke-width="2" filter="url(#sh)"/>
  <text x="1110" y="742" font-size="19" font-weight="700" fill="#0f172a">192.168.68.139</text>
  <rect x="1114" y="760" width="200" height="70" rx="10" fill="#f1f5f9" stroke="#475569" stroke-width="1.6"/>
  <text x="1130" y="787" font-size="15" font-weight="700" fill="#0f172a">Prometheus · Grafana</text>
  <text x="1130" y="809" font-size="12.5" fill="#334155">dashboards, alerts</text>
  <rect x="1334" y="760" width="200" height="70" rx="10" fill="#f1f5f9" stroke="#475569" stroke-width="1.6"/>
  <text x="1350" y="787" font-size="15" font-weight="700" fill="#0f172a">chainlens :30100</text>
  <text x="1350" y="809" font-size="12.5" fill="#334155">explorer, reads rpc2</text>
  <text x="1114" y="860" font-size="13" fill="#475569">scrapes :9545/:9546, :9100 (both coords),</text>
  <text x="1114" y="884" font-size="13" fill="#475569">.151:30000 (proxy), :9101 (all hosts)</text>
  <text x="1114" y="906" font-size="13" fill="#475569">not on the payment path</text>

  <!-- signing arrows coord1 -> mpc nodes -->
  <path d="M394,460 C410,470 420,480 440,500" fill="none" stroke="#7c3aed" stroke-width="2" marker-end="url(#aP)"/>
  <path d="M384,684 V758" fill="none" stroke="#7c3aed" stroke-width="2" marker-end="url(#aP)"/>
  <path d="M600,684 C600,720 909,720 909,758" fill="none" stroke="#7c3aed" stroke-width="2" marker-end="url(#aP)"/>
  <text x="374" y="703" font-size="12" font-weight="600" fill="#6d28d9" text-anchor="end">coord1 / coord2 → MPC nodes :7000</text>
  <!-- chainlens -> rpc2 -->
  <path d="M1434,758 C1434,620 1500,560 1460,476" fill="none" stroke="#2563eb" stroke-width="1.8" marker-end="url(#aB)"/>

  <!-- ===================== footer / legend ===================== -->
  <rect x="40" y="950" width="1520" height="180" rx="14" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="60" y="980" font-size="16" font-weight="700" fill="#0f172a">What survives</text>
  <text x="60" y="1006" font-size="14" fill="#334155">.135 lost: chain continues (val2–4), signing via coord2 with mpc2 + mpc3, VIPs move to .136 and proxy2 starts — seconds of errors.</text>
  <text x="60" y="1030" font-size="14" fill="#334155">.136, .137, .138 lost: nothing visible (one validator, at most one MPC node). .139 lost: no monitoring/explorer, payments continue.</text>
  <text x="60" y="1054" font-size="14" fill="#334155">Two of .135–.138 at once, or the whole site: the chain halts → docs/disaster-recovery.md (keys, hourly MPC backups, daily off-site chain snapshot).</text>

  <rect x="60" y="1078" width="18" height="12" fill="#dbeafe" stroke="#1d4ed8"/><text x="86" y="1089" font-size="13" fill="#334155">chain (Besu)</text>
  <rect x="190" y="1078" width="18" height="12" fill="#ede9fe" stroke="#6d28d9"/><text x="216" y="1089" font-size="13" fill="#334155">signing (MPC)</text>
  <rect x="330" y="1078" width="18" height="12" fill="#ecfdf5" stroke="#059669"/><text x="356" y="1089" font-size="13" fill="#334155">application</text>
  <rect x="460" y="1078" width="18" height="12" fill="#fff7ed" stroke="#ea580c"/><text x="486" y="1089" font-size="13" fill="#334155">HAProxy / keepalived</text>
  <rect x="650" y="1078" width="18" height="12" fill="#f1f5f9" stroke="#475569"/><text x="676" y="1089" font-size="13" fill="#334155">operations</text>
  <line x1="790" y1="1084" x2="830" y2="1084" stroke="#334155" stroke-width="2" stroke-dasharray="7 4"/><text x="840" y="1089" font-size="13" fill="#334155">standby / used on failover</text>
  <text x="60" y="1114" font-size="12.5" fill="#64748b">Besu p2p between all validators and RPC nodes (static peers + node allowlist) not drawn · details: docs/production-layout.md</text>
</svg>
