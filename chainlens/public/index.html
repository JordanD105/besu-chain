<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Chainlens</title>
    <link rel="stylesheet" href="/styles.css">
</head>
<body>
    <header class="top">
        <a class="brand" href="#/">
            <svg viewBox="0 0 32 32" aria-hidden="true">
                <path fill="#2b2b2b" d="M16 2 28 9v14L16 30 4 23V9z"/>
                <path fill="#fff" d="M16 7 23 11.2V19L16 23.2 9 19v-7.8z"/>
            </svg>
            <span>Chainlens</span>
        </a>
        <form id="search" class="search">
            <input id="search-input" type="search" data-i18n-placeholder="search.placeholder" placeholder="Search by address, token, transaction hash, or block number" autocomplete="off">
        </form>
        <select id="lang" class="lang" data-i18n-aria="lang.label" aria-label="Language">
            <option value="en">EN</option>
            <option value="ko">한국어</option>
            <option value="zh">中文</option>
        </select>
        <button id="admin-chip" class="admin-chip" type="button" hidden>Sign in</button>
        <button id="theme" class="theme" type="button" aria-label="Switch to light theme"></button>
    </header>
    <div class="shell">
        <aside class="side">
            <nav id="nav">
                <div class="nav-group" data-i18n="nav.explorer" data-roles="admin section public" hidden>Explorer</div>
                <a href="#/" data-nav="overview" data-roles="admin public" hidden><span class="ico">⌂</span> <span data-i18n="nav.overview">Overview</span></a>
                <a href="#/my" data-nav="my" data-roles="section" hidden><span class="ico">▣</span> <span data-i18n="nav.mySection">My section</span></a>
                <a href="#/activity/transactions" data-nav="transactions" data-roles="admin section public" hidden><span class="ico">⇄</span> <span data-i18n="nav.transactions">Transactions</span></a>
                <a href="#/activity/blocks" data-nav="blocks" data-roles="admin public" hidden><span class="ico">▦</span> <span data-i18n="nav.blocks">Blocks</span></a>
                <a href="#/accounts" data-nav="accounts" data-roles="admin section public" hidden><span class="ico">▤</span> <span data-i18n="nav.accounts">Accounts</span></a>
                <a href="#/items/avatars" data-nav="avatars" data-roles="admin section public" hidden><span class="ico">◆</span> <span data-i18n="nav.avatars">Avatars</span></a>
                <a href="#/items/nicknames" data-nav="nicknames" data-roles="admin section public" hidden><span class="ico">✎</span> <span data-i18n="nav.nicknamesPublic">Nicknames</span></a>
                <a href="#/statistics" data-nav="statistics" data-roles="admin section public" hidden><span class="ico">▥</span> <span data-i18n="nav.statistics">Statistics</span></a>
                <a href="#/contracts" data-nav="contracts" data-roles="admin public" hidden><span class="ico">⧉</span> <span data-i18n="nav.contracts">Contracts</span></a>
                <a href="#/network" data-nav="network" data-roles="admin public" hidden><span class="ico">◎</span> <span data-i18n="nav.network">Network</span></a>
                <div class="nav-group" data-roles="admin" hidden data-i18n="nav.admin">Admin</div>
                <a href="#/admin/sections" data-roles="admin" data-admin="sections" hidden><span class="ico">▣</span> <span data-i18n="nav.sections">Sections</span></a>
                <a href="#/admin/avatars" data-roles="admin" data-admin="sections" hidden><span class="ico">◆</span> <span data-i18n="nav.avatarAdmin">Avatars</span></a>
                <a href="#/admin/nicknames" data-roles="admin" data-admin="sections" hidden><span class="ico">✎</span> <span data-i18n="nav.nicknames">Nicknames</span></a>
                <a href="#/admin/deploy" data-roles="admin" data-admin="deploy" hidden><span class="ico">⇪</span> <span data-i18n="nav.deploy">Deploy</span></a>
                <a href="#/admin/gateways" data-roles="admin" data-admin="gateways" hidden><span class="ico">⇋</span> <span data-i18n="nav.gateways">Gateways</span></a>
                <div class="nav-group" data-i18n="nav.help" data-roles="admin section public anonymous" hidden>Help</div>
                <a id="nav-docs" href="#" target="_blank" rel="noopener" data-roles="admin section public anonymous" hidden><span class="ico">?</span> <span data-i18n="nav.docs">Docs</span> ↗</a>
                <a id="nav-grafana" href="#" target="_blank" rel="noopener" data-roles="admin public" hidden><span class="ico">▲</span> Grafana ↗</a>
            </nav>
            <div id="versions" class="versions"></div>
            <div class="status-row" id="status-badge" tabindex="0" aria-describedby="status-pop">
                <span id="status-dot"></span>
                <span id="status-text" data-i18n="status.title">Status</span>
                <div class="status-pop" id="status-pop" role="tooltip">
                    <div class="status-pct" id="status-pct">0%</div>
                    <div class="status-track"><span id="status-bar"></span></div>
                    <div class="status-label" data-i18n="status.latest">Latest Block</div>
                    <div class="status-value" id="status-head">0</div>
                    <div class="status-label" data-i18n="status.indexed">Latest Indexed Block</div>
                    <div class="status-value" id="status-indexed">0</div>
                </div>
            </div>
        </aside>
        <main id="view"></main>
    </div>
    <script src="/i18n.js"></script>
    <script src="/app.js"></script>
</body>
</html>
