# chainlens block explorer.
#   cp .env.example .env    # set BESU_RPC
#   docker compose up -d --build
#   open http://localhost:30100
services:
  chainlens:
    build: .
    image: localhost/besu-chainlens/chainlens
    restart: unless-stopped
    ports:
      - "${PORT:-30100}:30100"
    env_file:
      - .env
    environment:
      LISTEN_HOST: 0.0.0.0
      PORT: 30100
    volumes:
      # contract registry (records of besu-production/operator/deploy-contract.js): names and ABIs
      # for the contract pages. Read-only; new records are picked up within 15 s.
      - ${CONTRACT_REGISTRY_DIR:-../contracts/deployments}:/registry:ro
      # records written by the Deploy page (DEPLOY_ENABLED): writable by the container user (uid 1000)
      - ${CONTRACT_LOCAL_DIR:-./deployments-local}:/registry-local
      # section tokens (hashes only; written by the admin on a section's page): writable by uid 1000
      - ${CHAINLENS_TOKENS_DIR:-./tokens}:/tokens
    extra_hosts:
      # lets BESU_RPC=http://host.docker.internal:8545 reach a Besu node on this host
      - "host.docker.internal:host-gateway"
