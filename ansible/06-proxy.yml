# The proxy on .135 and .136: settings only (the image comes from 02-images.yml). keepalived
# (07-ha.yml) starts it on the host holding the VIP .151; a proxy already running here is updated.
- name: Hosts have the current code
  ansible.builtin.import_playbook: code-current.yml

- name: Proxy
  hosts: app_hosts
  become: true
  tasks:
    - name: SENDER01 known
      ansible.builtin.assert:
        that: sender01 is match('^0x[0-9a-fA-F]{40}$')
        fail_msg: "state/sender01 missing: run 04-coordinators.yml first"

    - name: Proxy settings
      ansible.builtin.template:
        src: templates/proxy.env.j2
        dest: "{{ repo_dir }}/proxy/.env"
        mode: "0600"
      register: proxy_env

    - name: Proxy running on this host?
      ansible.builtin.command: docker compose ps -q --status running proxy
      args:
        chdir: "{{ repo_dir }}/proxy"
      register: proxy_running
      changed_when: false

    - name: Update the running proxy (new settings or image)
      ansible.builtin.command: docker compose up -d proxy
      args:
        chdir: "{{ repo_dir }}/proxy"
      when: proxy_running.stdout | length > 0
      register: proxy_up
      changed_when: proxy_up.stderr is search('Recreated|Started')

    - name: Redis running here without the proxy? (left from an earlier failover)
      ansible.builtin.command: docker compose ps -q --status running redis
      args:
        chdir: "{{ repo_dir }}/proxy"
      register: redis_running
      changed_when: false
      when: proxy_running.stdout | length == 0

    - name: Update that redis (new image or settings)
      ansible.builtin.command: docker compose up -d redis
      args:
        chdir: "{{ repo_dir }}/proxy"
      when: proxy_running.stdout | length == 0 and redis_running.stdout | default('') | length > 0
      register: redis_up
      changed_when: redis_up.stderr is search('Recreated|Started')
