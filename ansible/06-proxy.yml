# The proxy on .135 and .136: settings only (the image comes from 02-images.yml). keepalived
# (07-ha.yml) starts it on the host holding the VIP .151; a proxy already running here is updated.
- name: Hosts have the current code
  ansible.builtin.import_playbook: code-current.yml

# The SectionRegistry (docs/features/sections.md), once: an MPC admin key, then the contract deployed from
# it with deploy-contract.js (operator, proxy image), straight to coord1 and rpc1 (the VIPs come up
# in 07-ha.yml). The address and admin go to state/registry.json, then into the proxy settings.
# A registry of an older version (v1) is replaced by a new one (same admin); 08-check.yml then
# migrates its sections and user accounts (registry.json "previous").
- name: Section registry (once, or upgrade)
  hosts: localhost
  gather_facts: false
  vars:
    registry_file: "{{ state_dir }}/registry.json"
    admin_file: "{{ state_dir }}/registry-admin"
    rpc1_url: "http://{{ ip_of[rpc_nodes[0].host] }}:{{ rpc_nodes[0].rpc_port }}"
  tasks:
    - name: Registry already deployed?
      ansible.builtin.stat:
        path: "{{ registry_file }}"
      register: registry_stat

    - name: Version of the deployed registry
      ansible.builtin.uri:
        url: "{{ rpc1_url }}"
        method: POST
        body_format: json
        body: { jsonrpc: "2.0", id: 1, method: eth_call, params: [{ to: "{{ old_registry.address }}", data: "0xffa1ad74" }, latest] }
      register: registry_version
      when: registry_stat.stat.exists
      vars:
        old_registry: "{{ lookup('ansible.builtin.file', registry_file) | from_json }}"

    - name: Registry to deploy (none yet, or older than this code's version 2)
      ansible.builtin.set_fact:
        registry_deploy_needed: >-
          {{ not registry_stat.stat.exists or (registry_version.json.result | default('0x0') | int(base=16)) < 2 }}
        registry_previous: >-
          {{ (lookup('ansible.builtin.file', registry_file) | from_json).address if registry_stat.stat.exists else '' }}

    - name: Deploy the registry
      when: registry_deploy_needed | bool
      block:
        - name: Admin key already created (an earlier run stopped before the deployment)?
          ansible.builtin.stat:
            path: "{{ admin_file }}"
          register: admin_stat

        - name: Registry admin key (MPC, small presignature pool)
          ansible.builtin.uri:
            url: "{{ coord1_url }}/admin/keys"
            method: POST
            headers:
              Authorization: "Bearer {{ mpc_admin_token }}"
            body_format: json
            body: { pool: small }
            timeout: 180
          register: admin_key
          when: not admin_stat.stat.exists

        - name: Remember the admin key
          ansible.builtin.copy:
            dest: "{{ admin_file }}"
            content: "{{ admin_key.json.address }}\n"
            mode: "0600"
          when: not admin_stat.stat.exists

        - name: Deploy SectionRegistry, signed by the admin key (MPC)
          ansible.builtin.shell: >-
            docker run --rm --network host -u "$(id -u)" -v {{ repo_root | quote }}:/work -w /work
            -e NODE_PATH=/app/node_modules {{ app_images.proxy }}
            node besu-production/operator/deploy-contract.js --artifact proxy/section-registry.json
            --from {{ lookup('ansible.builtin.file', admin_file) | trim }} --name SectionRegistry
            --coordinator {{ coord1_url }} --rpc {{ rpc1_url }}
            --sender01 {{ (state_dir ~ '/sender01') | relpath(repo_root) }}
            --out {{ (state_dir ~ '/registry-record') | relpath(repo_root) }} --yes
          register: registry_deploy
          changed_when: true

        - name: The deployed address
          ansible.builtin.set_fact:
            registry_address: "{{ registry_deploy.stdout | regex_search('deployed\\s+(0x[0-9a-fA-F]{40})', '\\1') | first }}"

        - name: Record the registry (state/registry.json)
          ansible.builtin.copy:
            dest: "{{ registry_file }}"
            content: "{{ registry_record | to_nice_json }}\n"
            mode: "0600"
          vars:
            registry_record: >-
              {{ {'address': registry_address, 'admin': lookup('ansible.builtin.file', admin_file) | trim}
                 | combine({'previous': registry_previous, 'migrated': false} if registry_previous else {}) }}

    - name: Contract account center already created?
      ansible.builtin.stat:
        path: "{{ state_dir }}/contract-center"
      register: center_stat

    - name: Contract account center (MPC key that deploys every contract, big presignature pool)
      ansible.builtin.uri:
        url: "{{ coord1_url }}/admin/keys"
        method: POST
        headers:
          Authorization: "Bearer {{ mpc_admin_token }}"
        body_format: json
        body: { pool: big }
        timeout: 180
      register: center_key
      when: not center_stat.stat.exists

    - name: Remember the contract account center
      ansible.builtin.copy:
        dest: "{{ state_dir }}/contract-center"
        content: "{{ center_key.json.address }}\n"
        mode: "0600"
      when: not center_stat.stat.exists

    - name: Registry
      ansible.builtin.debug:
        msg: "SectionRegistry {{ reg.address }}, admin {{ reg.admin }}"
      vars:
        reg: "{{ lookup('ansible.builtin.file', registry_file) | from_json }}"

- name: Proxy
  hosts: app_hosts
  become: true
  tasks:
    - name: SENDER01 known
      ansible.builtin.assert:
        that: sender01 is match('^0x[0-9a-fA-F]{40}$')
        fail_msg: "state/sender01 missing: run 04-coordinators.yml first"

    - name: Proxy settings
      ansible.builtin.template:
        src: templates/proxy.env.j2
        dest: "{{ repo_dir }}/proxy/.env"
        mode: "0600"
      register: proxy_env

    - name: Proxy running on this host?
      ansible.builtin.command: docker compose ps -q --status running proxy
      args:
        chdir: "{{ repo_dir }}/proxy"
      register: proxy_running
      changed_when: false

    - name: Update the running proxy (new settings or image)
      ansible.builtin.command: docker compose up -d proxy
      args:
        chdir: "{{ repo_dir }}/proxy"
      when: proxy_running.stdout | length > 0
      register: proxy_up
      changed_when: proxy_up.stderr is search('Recreated|Started')

    - name: Redis exporter (both HA hosts; Prometheus reads the active one through the proxy VIP)
      ansible.builtin.command: docker compose up -d redis-exporter
      args:
        chdir: "{{ repo_dir }}/proxy"
      register: exporter_up
      changed_when: exporter_up.stderr is search('Recreated|Started|Created')

    - name: Redis running here without the proxy? (left from an earlier failover)
      ansible.builtin.command: docker compose ps -q --status running redis
      args:
        chdir: "{{ repo_dir }}/proxy"
      register: redis_running
      changed_when: false
      when: proxy_running.stdout | length == 0

    - name: Update that redis (new image or settings)
      ansible.builtin.command: docker compose up -d redis
      args:
        chdir: "{{ repo_dir }}/proxy"
      when: proxy_running.stdout | length == 0 and redis_running.stdout | default('') | length > 0
      register: redis_up
      changed_when: redis_up.stderr is search('Recreated|Started')
