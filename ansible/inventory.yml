# The 5 hosts of the production layout (docs/overview/production-layout.md).
# THE IP PLAN: set each host's ansible_host here, and the two floating IPs (VIPs) and their mask
# in group_vars/all/settings.yml. Ansible generates every file that contains addresses (HAProxy,
# keepalived, firewall, Prometheus targets, .env files, team instructions) from them.
# Host names (h135 ...) are only labels: they don't have to match the IPs.
# ansible_user: an account with SSH key login and sudo on every host.
servers:
  vars:
    ansible_user: root
  hosts:
    h135: { ansible_host: 192.168.68.135 }   # val1, rpc1, coord1, proxy1, mpc1 (HA pair, primary)
    h136: { ansible_host: 192.168.68.136 }   # val2, rpc2, coord2, proxy2       (HA pair, standby)
    h137: { ansible_host: 192.168.68.137 }   # val3, mpc2
    h138: { ansible_host: 192.168.68.138 }   # val4, mpc3
    h139: { ansible_host: 192.168.68.139 }   # monitoring, chainlens
  children:
    besu_hosts:   { hosts: { h135: {}, h136: {}, h137: {}, h138: {} } }
    app_hosts:    { hosts: { h135: {}, h136: {} } }        # coordinators, proxies, HAProxy, keepalived
    mpc_hosts:    { hosts: { h135: {}, h137: {}, h138: {} } }  # MPC nodes: run by their teams
    monitoring_hosts: { hosts: { h139: {} } }
    # Section gateways (gateway_enabled in settings.yml): the host next to each section's application,
    # with the section it serves, e.g.  h137: { gateway_section: 1 }
    gateway_hosts: { hosts: {} }
