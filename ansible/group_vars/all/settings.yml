# ---- Settings to review before the first run -------------------------------------------------

# ---- Who may connect: the firewall opens each service only to these IPs ----------------------
# Lists take addresses and networks, e.g. [192.168.68.21, 10.1.2.0/24] (192.168.68.* is written
# 192.168.68.0/24). See ACCESS.md.
# The operator / bastion running Ansible: SSH, the MPC admin API, Besu RPC, and every service
# below. REQUIRED: the firewall closes everything else, so a wrong value locks you out.
operator_ip: ""
# Applications calling the proxy API (VIP .151:30000)
proxy_client_ips: []
# Users of chainlens, the block explorer (monitoring host :30100)
chainlens_ips: []
# Users of Grafana, the monitoring dashboards (monitoring host :3000)
grafana_ips: []
# Developers using the Remix IDE (monitoring host :30200, remix_enabled below)
remix_ips: []

# Floating IPs (keepalived) on the HA pair (app_hosts). The host IPs are in inventory.yml.
# Both VIPs must be UNUSED addresses in the same subnet as the two app hosts (keepalived moves
# them with ARP), and vip_prefix must be that subnet's mask length.
vip_rpc: 192.168.68.150     # HAProxy: Besu RPC :8545 and MPC signer :9100
vip_proxy: 192.168.68.151   # the active proxy :30000
vip_prefix: 24

# Time servers for chrony on every host, e.g. [ntp1.internal.example, 10.0.0.1]. Empty: the
# distribution's default (public pool.ntp.org servers: needs internet access). QBFT rejects blocks
# whose timestamps are off, so hosts without internet need internal servers here.
ntp_servers: []

# VRRP network interface on the HA pair: empty = the interface holding the host's IP
vrrp_interface: ""

# Chain (genesis): only used when the network files are created, never changed afterwards
chain_id: 1337
block_period: 1          # seconds per block (1 on one LAN)
request_timeout: 2       # QBFT round timeout seconds (> block_period)
block_gas_limit: "0x1c9c380"
sender01_funding_wei: "1000000000000000000000000"   # SENDER01 balance in the genesis (1,000,000 ETH)

# MPC signing policy (cluster.json; every node enforces it)
mpc_max_value_wei: "1000000000000000000000"   # 1000 ETH per transaction
mpc_max_gas: 30000000
mpc_allowed_to: ""        # leave empty for the proxy (see mpc-signer/docs/production.md)
# Presignature pools: big keys (SENDER01) keep mpc_pool_target, small keys mpc_pool_target_small.
# Accounts from /createaccount get mpc_new_account_pool unless the request names a pool.
mpc_pool_target: 500
mpc_pool_target_small: 20
mpc_new_account_pool: small     # big, small or none

# Third-party images (exact versions)
besu_image: hyperledger/besu:26.11.1
node_exporter_image: prom/node-exporter:v1.12.1
prometheus_image: prom/prometheus:v3.16.0
grafana_image: grafana/grafana:13.2
redis_image: redis:8.10.3
redis_exporter_image: oliver006/redis_exporter:v1.67.0

# Optional: load the images above from `docker save` archives instead of pulling them from Docker
# Hub (hosts without Docker Hub access, or to avoid its rate limit). A directory on the operator
# holding these files; each must contain the image above with the same name and tag.
image_archives_dir: ""
image_archives:
  besu: besu-26.11.1-docker.tar
  node_exporter: node-exporter-v1.12.1-docker.tar
  prometheus: prometheus-3.16.0-docker.tar
  grafana: grafana-13.2-docker.tar
  redis: redis-8.10.3-docker.tar
  redis_exporter: redis-exporter-v1.67.0-docker.tar

besu_java_opts: -Xmx4g
mpc_image: registry.example.com/mpc-signer:1.3.0
# true: build mpc_image on the operator and copy it to the hosts (docker save/load).
# false: the hosts pull mpc_image from your registry.
mpc_image_build: true
mpc_bigint: bigint-rug    # GMP backend (faster, LGPL); "" for the pure-Rust default

# Self-hosted Remix IDE on the monitoring host (:30200, remix/README.md): compile and test
# contracts in the browser, with a local compiler mirror (no internet needed by its users).
# The operator fetches the prebuilt Remix site once (git, github.com) and builds the image.
remix_enabled: true
remix_repo: https://github.com/remix-project-org/remix-live.git   # branch gh-pages = Remix builds
remix_commit: b694f46a0adad6ff2a54bcf0b0a5340e94631a56            # Remix 2.6.15
remix_solc_versions: ["0.8.28"]   # compilers offered (Remix's default version is always added)
# (who may open Remix: remix_ips at the top)

# Sections (docs/sections.md): applications call /createaccount and /transfer with their section's
# X-Section-Key. false: calls without a key still use SENDER01 (for applications not moved yet);
# true: such calls are refused.
sections_required: false
# Alerts (Grafana "Sections" dashboard, alert SectionUpfrontLow / SectionUpfrontEmpty): an enabled
# section's upfront account below this many ETH. 0 = off.
upfront_low_balance_eth: 100
# Alert Sender01Low: SENDER01 (it funds every top-up) below this many ETH. 0 = off.
sender01_low_balance_eth: 10000
# RPC VIP health (ha/rpc-health.py): an RPC node leaves the VIP when its newest block is older than
# rpc_max_block_age seconds while another node has newer blocks, or it is more than
# rpc_max_blocks_behind blocks behind. A node that stays stalled rpc_auto_restart_minutes while the
# chain moves on is restarted (docker restart; RPC nodes hold no keys). 0 = never restart.
rpc_max_block_age: 30
rpc_max_blocks_behind: 10
rpc_auto_restart_minutes: 5
# How long Prometheus keeps metrics (Grafana Sections "Period": Year needs > 365d), and a disk cap:
# above it the oldest data goes first (0B = no cap).
prometheus_retention: 400d
prometheus_retention_size: 20GB

# Deploy page in chainlens (#/deploy, ansible/CHAINLENS-DEPLOY.md): deploy compiled contracts (common
# or NFT collections) from the browser, through the proxy, signed by the contract account center and
# registered on chain. Only operator_ip and chainlens_deploy_ips can use it, with the token Ansible
# generates (state/secrets/chainlens_deploy_token). Off by default.
chainlens_deploy_enabled: false
# Addresses (or networks) allowed to use the Deploy page besides operator_ip, e.g. an admin PC:
# [192.168.68.1]. They can deploy contracts (with the token): list admin machines only. The firewall
# opens chainlens (:30100) for them too, so they need not be in chainlens_ips.
chainlens_deploy_ips: []
# Sections page in chainlens (#/sections, docs/sections.md): create sections, top up, sweep, pay
# back, rename, info fields, API keys, accounts, archive, history. Same access as the Deploy page (operator_ip,
# chainlens_deploy_ips, the same token). Off by default.
chainlens_sections_enabled: false
# (chainlens_deployer is no longer used: the Deploy page deploys through the proxy, signed by the
# contract account center, created by Ansible: state/contract-center)

# Extra compose files for building the proxy / chainlens / remix images on the operator, e.g. to
# set a build proxy or a corporate CA:  { proxy: [/path/override.yml], chainlens: [...] }
build_compose_overrides: {}

# Install Docker, firewalld, chrony, HAProxy, keepalived (dnf on RHEL family, apt on Debian/Ubuntu).
# false: they are already installed.
install_packages: true

# Daily chain snapshot on val3 (.137)
snapshot_dir: /backup/chain
snapshot_copy_to: ""      # off-site rsync target, e.g. backup@offsite:/besu-chain (needs root's SSH key)
snapshot_cron_hour: 3
snapshot_cron_minute: 17
snapshot_first_run: true  # take a snapshot now when none exists yet (val3 stops for a few minutes)

# Node key backups (val1-val4, rpc1, rpc2), once per key: encrypted ON THE HOST with this GPG
# PUBLIC key (armored file on the operator, e.g. made with: gpg --armor --export you@example),
# the plain copy deleted at once, the encrypted file fetched to state/key-backups/. Keep the
# matching PRIVATE key offline: it is the only way to read these backups.
# Empty: skipped (the ValidatorKeyBackupMissing alert stays until the keys are backed up).
key_backup_gpg_public_key: ""

# MPC share backups (hourly backup.sh on the 3 MPC nodes). The nodes belong to their teams
# (option B), so this is OFF by default: each team sets up its own. true: Ansible installs the
# cron and runs it once. The archives are sealed (useless without the team's passphrase) and stay
# on the node's own host in mpc_backup_dir: each team still copies them off the host.
mpc_backup_cron: false
mpc_backup_dir: /secure/mpc-backup
# Where the MPC nodes run on their hosts (their docker-compose.yml, .env, backup.sh): the node
# package inside the repository. Ansible refreshes the repository's tracked files there but never
# touches the team's .env, cluster.json or node<ID>.json.
mpc_node_dir: /opt/besu-chain/mpc-signer/deploy/node

# Test account + transfer through the VIPs after the deployment (once; costs 1 ETH of SENDER01)
smoke_test: true

# Where the repository goes on every host (the keepalived scripts use /opt/besu-chain/proxy)
repo_dir: /opt/besu-chain
