[defaults]
inventory = inventory.yml
interpreter_python = auto_silent
forks = 10
# the hosts depend on each other: stop everything when one host fails
any_errors_fatal = true
# the operator's state (tokens, public key files, genesis, cluster.json) lives in ./state
retry_files_enabled = false
stdout_callback = default
callback_result_format = yaml

[ssh_connection]
pipelining = true
