# MPC nodes. Two ways (mpc_install in settings.yml):
#   ansible (default): Ansible installs the three nodes during the run: .env, init.sh (each node's
#     passphrase is generated ON its host and never leaves it), node<ID>.json, cluster.json, start.
#     One person (whoever runs Ansible, with root on the 3 hosts) can then reach all three shares.
#   teams: each node is initialised and started by ITS OWN TEAM, never by Ansible, so no single person
#     or tool holds two key shares. This phase then writes the instructions for each team
#     (state/handoff/mpcN.md), stops until the teams have sent node0.json, node1.json, node2.json
#     (state/mpc/), builds cluster.json and stops until the teams have started their nodes. Run the
#     playbook again after each team step: it continues where it stopped.
# Rerun-safe either way: a node that is already initialised (its node<ID>.json exists) is never
# initialised again, and an existing .env (passphrase) is never overwritten.
- name: Hosts have the current code
  ansible.builtin.import_playbook: code-current.yml

- name: MPC nodes, installed by Ansible (mpc_install = ansible)
  hosts: mpc_hosts
  become: true
  gather_facts: true
  vars:
    node: "{{ mpc_nodes | selectattr('host', 'equalto', inventory_hostname) | first }}"
  tasks:
    - name: Only with mpc_install = ansible
      ansible.builtin.meta: end_play
      when: mpc_install != 'ansible'

    - name: The node package in mpc_node_dir
      ansible.builtin.command: cp -r {{ repo_dir }}/mpc-signer/deploy/node {{ mpc_node_dir }}
      args:
        creates: "{{ mpc_node_dir }}/docker-compose.yml"
      when: mpc_node_dir != repo_dir ~ '/mpc-signer/deploy/node'

    - name: .env (created once; the passphrase stays empty for init.sh to fill on this host)
      ansible.builtin.copy:
        dest: "{{ mpc_node_dir }}/.env"
        force: false
        mode: "0600"
        content: |
          # Written by Ansible (03-mpc-nodes.yml, mpc_install: ansible). init.sh fills MPC_NODE_PASSPHRASE.
          MPC_IMAGE={{ mpc_image }}
          MPC_NODE_ID={{ node.id }}
          MPC_BIND_IP={{ ip_of[inventory_hostname] }}
          MPC_PORT=7000
          MPC_NODE_PASSPHRASE=
          MPC_NODE_TOKEN={{ mpc_node_token }}
          MPC_COMPUTE_THREADS={{ ansible_processor_vcpus | default(4) }}
      no_log: true

    - name: The current image in .env
      ansible.builtin.lineinfile:
        path: "{{ mpc_node_dir }}/.env"
        regexp: '^MPC_IMAGE='
        line: "MPC_IMAGE={{ mpc_image }}"
      register: mpc_image_line

    - name: Initialised already? (node<ID>.json here or in state/mpc)
      ansible.builtin.stat:
        path: "{{ mpc_node_dir }}/node{{ node.id }}.json"
      register: node_here

    - name: node<ID>.json in state/mpc
      ansible.builtin.stat:
        path: "{{ state_dir }}/mpc/node{{ node.id }}.json"
      delegate_to: localhost
      become: false
      register: node_state

    - name: Initialise the node (identity, sealed with a passphrase generated here)
      ansible.builtin.command: ./init.sh
      args:
        chdir: "{{ mpc_node_dir }}"
        creates: "{{ mpc_node_dir }}/node{{ node.id }}.json"
      when: not node_here.stat.exists and not node_state.stat.exists

    - name: Its public keys to the operator (state/mpc/node<ID>.json)
      ansible.builtin.fetch:
        src: "{{ mpc_node_dir }}/node{{ node.id }}.json"
        dest: "{{ state_dir }}/mpc/node{{ node.id }}.json"
        flat: true
      when: not node_state.stat.exists

- name: MPC nodes, node files and cluster.json
  hosts: localhost
  gather_facts: false
  tasks:
    - name: Team instructions (mpc_install = teams)
      when: mpc_install == 'teams'
      ansible.builtin.template:
        src: templates/mpc-handoff.md.j2
        dest: "{{ state_dir }}/handoff/{{ n.name }}.md"
        mode: "0600"
      loop: "{{ mpc_nodes }}"
      loop_control:
        loop_var: n
        label: "{{ n.name }}"

    - name: Node files from the teams
      ansible.builtin.stat:
        path: "{{ state_dir }}/mpc/node{{ item.id }}.json"
      loop: "{{ mpc_nodes }}"
      loop_control:
        label: "node{{ item.id }}.json"
      register: node_files

    - name: Waiting for the MPC teams (1/2)
      ansible.builtin.fail:
        msg: |
          STOPPED: waiting for the MPC teams. Missing: {{ missing | join(', ') }}
          1. Give each team its instructions: {{ state_dir }}/handoff/mpc1.md, mpc2.md, mpc3.md
             and MPC_NODE_TOKEN (state/secrets/mpc_node_token) over a secret channel.
          2. Each team runs init.sh on its host and sends node<ID>.json back.
          3. Put the files in {{ state_dir }}/mpc/ and run the playbook again.
      vars:
        missing: "{{ node_files.results | rejectattr('stat.exists') | map(attribute='item.id') | map('regex_replace', '^(.*)$', 'node\\1.json') | list }}"
      when: missing | length > 0

    - name: Node files match the layout
      ansible.builtin.assert:
        that:
          - nf.id == item.id
          - nf.url == 'http://' ~ ip_of[item.host] ~ ':7000'
        fail_msg: "node{{ item.id }}.json: id {{ nf.id }} / url {{ nf.url }}, expected id {{ item.id }} and http://{{ ip_of[item.host] }}:7000"
      vars:
        nf: "{{ lookup('ansible.builtin.file', state_dir ~ '/mpc/node' ~ item.id ~ '.json') | from_json }}"
      loop: "{{ mpc_nodes }}"
      loop_control:
        label: "node{{ item.id }}.json"

    - name: cluster.json (created once)
      ansible.builtin.shell: >-
        {{ repo_root }}/mpc-signer/deploy/make-cluster.sh node0.json node1.json node2.json > ../cluster.json.tmp
        && mv ../cluster.json.tmp ../cluster.json
      args:
        chdir: "{{ state_dir }}/mpc"
        creates: "{{ state_dir }}/cluster.json"
      environment:
        CHAIN_ID: "{{ chain_id }}"
        MAX_VALUE_WEI: "{{ mpc_max_value_wei }}"
        MAX_GAS: "{{ mpc_max_gas }}"
        ALLOWED_TO: "{{ mpc_allowed_to }}"

    - name: cluster.json checksum
      ansible.builtin.stat:
        path: "{{ state_dir }}/cluster.json"
        checksum_algorithm: sha256
      register: cluster

- name: MPC nodes started by Ansible (mpc_install = ansible)
  hosts: mpc_hosts
  become: true
  gather_facts: false
  tasks:
    - name: Only with mpc_install = ansible
      ansible.builtin.meta: end_play
      when: mpc_install != 'ansible'

    - name: cluster.json on the node
      ansible.builtin.copy:
        src: "{{ state_dir }}/cluster.json"
        dest: "{{ mpc_node_dir }}/cluster.json"
        mode: "0644"
      register: cluster_copy

    - name: Start the node
      ansible.builtin.command: docker compose up -d
      args:
        chdir: "{{ mpc_node_dir }}"
      register: mpc_up
      changed_when: mpc_up.stderr is search('Started|Recreated|Created')

    - name: Reload it when cluster.json changed
      ansible.builtin.command: docker compose restart
      args:
        chdir: "{{ mpc_node_dir }}"
      when: cluster_copy.changed and not (mpc_up.stderr is search('Started|Recreated|Created'))
      changed_when: true

- name: MPC nodes answering
  hosts: localhost
  gather_facts: false
  tasks:
    - name: cluster.json checksum
      ansible.builtin.stat:
        path: "{{ state_dir }}/cluster.json"
        checksum_algorithm: sha256
      register: cluster

    - name: MPC nodes answering (checked from coord1's host; port 7000 is open to the coordinators only)
      ansible.builtin.uri:
        url: "http://{{ ip_of[item.host] }}:7000/health"
        return_content: true
        timeout: 5
      delegate_to: "{{ coordinators[0].host }}"
      register: health
      failed_when: false
      until: mpc_install == 'teams' or (health.content | default('')) == 'ok'
      retries: 20
      delay: 3
      loop: "{{ mpc_nodes }}"
      loop_control:
        label: "{{ item.name }}"

    - name: Waiting for the MPC teams (2/2)
      ansible.builtin.fail:
        msg: |
          STOPPED: waiting for the MPC teams to start their nodes. Not answering: {{ down | join(', ') }}
          Send {{ state_dir }}/cluster.json to the three teams.
          sha256: {{ cluster.stat.checksum }}  (each team compares it over a second channel)
          Each team copies it to {{ mpc_node_dir }}/ and runs: docker compose up -d
          Then run the playbook again.
      vars:
        down: "{{ health.results | rejectattr('content', 'defined') | map(attribute='item.name') | list
                  + health.results | selectattr('content', 'defined') | rejectattr('content', 'equalto', 'ok') | map(attribute='item.name') | list }}"
      when: down | length > 0

    - name: MPC nodes up
      ansible.builtin.debug:
        msg: "mpc1, mpc2, mpc3 answer. cluster.json sha256 {{ cluster.stat.checksum }}"
