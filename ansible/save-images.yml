# Save ALL the deployment's images as `docker save` archives in image_archives_dir:
# - third-party (Besu, node-exporter, Prometheus, Grafana, redis): versions and file names from
#   group_vars/all/settings.yml; pulled first when missing on the operator;
# - built by 02-images.yml (MPC signer, proxy, chainlens, remix): copied from state/images/, so run
#   site.yml (or 02-images.yml) first. File names: built_image_archives in layout.yml.
#   (with docs_site_enabled, also the documentation site image)
# - the base images of those builds (the FROM lines of their Dockerfiles: node, python, nginx, rust,
#   debian) as base-<image>.tar, for building without internet (offline_build); pulled first when
#   missing. Remix's site and compilers for an offline build: offline/make-offline.sh --remix DIR.
# Run it on the operator:
#   ansible-playbook save-images.yml                          uses image_archives_dir from settings.yml
#   ansible-playbook save-images.yml -e image_archives_dir=/opt/000
#   ansible-playbook save-images.yml --tags base-images       only the base images of the builds
# An archive that already holds the right image is kept; a missing or different one is (re)written.
- name: Save all images as archives
  hosts: localhost
  gather_facts: false
  vars:
    images: "{{ image_archives | dict2items(key_name='key', value_name='file') }}"
  tasks:
    - name: Archive directory set
      ansible.builtin.assert:
        that: image_archives_dir | length > 0
        fail_msg: "Set image_archives_dir in settings.yml, or run with -e image_archives_dir=/opt/000"
      tags: [always]

    - name: Archive directory
      ansible.builtin.file:
        path: "{{ image_archives_dir }}"
        state: directory
        mode: "0755"
      tags: [always]

    - name: Images present locally?
      ansible.builtin.command: docker image inspect {{ lookup('ansible.builtin.vars', item.key ~ '_image') }}
      loop: "{{ images }}"
      loop_control:
        label: "{{ lookup('ansible.builtin.vars', item.key ~ '_image') }}"
      register: local_img
      changed_when: false
      failed_when: false

    - name: Pull the missing images
      ansible.builtin.command: docker pull --quiet {{ lookup('ansible.builtin.vars', item.item.key ~ '_image') }}
      loop: "{{ local_img.results }}"
      loop_control:
        label: "{{ lookup('ansible.builtin.vars', item.item.key ~ '_image') }}"
      when: item.rc != 0
      changed_when: true

    - name: Archives already holding the right image?
      ansible.builtin.shell: >-
        set -o pipefail;
        tar -xOf {{ (image_archives_dir ~ '/' ~ item.file) | quote }} manifest.json 2>/dev/null
        | grep -qF '"{{ lookup('ansible.builtin.vars', item.key ~ '_image') }}"'
      args:
        executable: /bin/bash
      loop: "{{ images }}"
      loop_control:
        label: "{{ item.file }}"
      register: archive_ok
      changed_when: false
      failed_when: false

    - name: Save the missing or different archives
      ansible.builtin.shell: >-
        docker save -o {{ (image_archives_dir ~ '/' ~ item.item.file ~ '.tmp') | quote }}
        {{ lookup('ansible.builtin.vars', item.item.key ~ '_image') }}
        && mv {{ (image_archives_dir ~ '/' ~ item.item.file ~ '.tmp') | quote }}
        {{ (image_archives_dir ~ '/' ~ item.item.file) | quote }}
      loop: "{{ archive_ok.results }}"
      loop_control:
        label: "{{ item.item.file }}"
      when: item.rc != 0
      changed_when: true

    - name: Base images of the builds (the FROM lines of their Dockerfiles)
      ansible.builtin.shell: >-
        set -o pipefail;
        grep -hoE '^FROM [^ ]+' {{ build_dockerfiles | join(' ') }} | awk '{print $2}' | sort -u
      args:
        chdir: "{{ repo_root }}"
        executable: /bin/bash
      register: base_images
      changed_when: false
      tags: [base-images]

    - name: Save the base images (base-<image>.tar and its image id in .id; pulled first when missing, kept when unchanged)
      ansible.builtin.shell: |
        set -eo pipefail
        f={{ (image_archives_dir ~ '/base-' ~ (item | regex_replace('[/:]', '_')) ~ '.tar') | quote }}
        docker image inspect {{ item | quote }} >/dev/null 2>&1 || docker pull --quiet {{ item | quote }} >/dev/null
        id=$(docker image inspect -f '{% raw %}{{.Id}}{% endraw %}' {{ item | quote }})
        if [ -f "$f" ] && [ "$(cat "$f.id" 2>/dev/null)" = "$id" ]; then echo "kept $(du -h "$f" | cut -f1)"; exit 0; fi
        docker save -o "$f.tmp" {{ item | quote }} && mv "$f.tmp" "$f" && printf '%s' "$id" > "$f.id" && echo "saved $(du -h "$f" | cut -f1)"
      args:
        executable: /bin/bash
      loop: "{{ base_images.stdout_lines }}"
      register: base_saved
      changed_when: "'saved' in base_saved.stdout"
      tags: [base-images]

    - name: Built images from 02-images.yml (MPC signer, proxy, chainlens, remix)
      ansible.builtin.stat:
        path: "{{ state_dir }}/images/{{ item }}"
      loop: >-
        {{ ([mpc_image | regex_replace('[/:]', '_') ~ '.tar'] if mpc_image_build | bool else [])
           + built_apps | map('regex_replace', '$', '.tar') | list }}
      register: built

    - name: Built images exist
      ansible.builtin.assert:
        that: built.results | rejectattr('stat.exists') | list | length == 0
        fail_msg: >-
          Not built yet: {{ built.results | rejectattr('stat.exists') | map(attribute='item') | join(', ') }}.
          Run ansible-playbook 02-images.yml (or site.yml) first: it builds them into state/images/.

    - name: Copy the built MPC image (replaced when its content changed)
      ansible.builtin.copy:
        src: "{{ state_dir }}/images/{{ mpc_image | regex_replace('[/:]', '_') }}.tar"
        dest: "{{ image_archives_dir }}/{{ built_image_archives.mpc }}"
        mode: "0644"
      when: mpc_image_build | bool

    - name: Copy the built proxy, chainlens (remix, documentation site) images (replaced when their content changed)
      ansible.builtin.copy:
        src: "{{ state_dir }}/images/{{ item }}.tar"
        dest: "{{ image_archives_dir }}/{{ built_image_archives[item] }}"
        mode: "0644"
      loop: "{{ built_apps }}"

    - name: MPC image from the registry (mpc_image_build false)
      when: not mpc_image_build | bool
      block:
        - name: MPC image present locally?
          ansible.builtin.command: docker image inspect {{ mpc_image }}
          register: mpc_local
          changed_when: false
          failed_when: false

        - name: Pull the MPC image
          ansible.builtin.command: docker pull --quiet {{ mpc_image }}
          when: mpc_local.rc != 0
          changed_when: true

        - name: MPC archive already holding it?
          ansible.builtin.shell: >-
            set -o pipefail;
            tar -xOf {{ (image_archives_dir ~ '/' ~ built_image_archives.mpc) | quote }} manifest.json 2>/dev/null
            | grep -qF '"{{ mpc_image }}"'
          args:
            executable: /bin/bash
          register: mpc_archive
          changed_when: false
          failed_when: false

        - name: Save the MPC image
          ansible.builtin.shell: >-
            docker save -o {{ (image_archives_dir ~ '/' ~ built_image_archives.mpc ~ '.tmp') | quote }} {{ mpc_image }}
            && mv {{ (image_archives_dir ~ '/' ~ built_image_archives.mpc ~ '.tmp') | quote }}
            {{ (image_archives_dir ~ '/' ~ built_image_archives.mpc) | quote }}
          when: mpc_archive.rc != 0
          changed_when: true

    - name: Archive sizes
      ansible.builtin.stat:
        path: "{{ image_archives_dir }}/{{ item.file }}"
      loop: "{{ images + (built_image_archives | dict2items(key_name='key', value_name='file')) }}"
      loop_control:
        label: "{{ item.file }}"
      register: sizes

    - name: Archives
      ansible.builtin.debug:
        msg: "{{ item.stat.path }}  {{ (item.stat.size / 1048576) | round | int }} MB"
      loop: "{{ sizes.results }}"
      loop_control:
        label: "{{ item.item.file }}"
      when: item.stat.exists
