# HAProxy + keepalived on .135 and .136 (ha/README.md). .135 first: it takes both VIPs and
# keepalived starts proxy1 there. Config changes later are applied with a reload, which keeps
# the VIPs where they are.
- name: Hosts have the current code
  ansible.builtin.import_playbook: code-current.yml

- name: HAProxy and keepalived
  hosts: app_hosts
  become: true
  serial: 1
  tasks:
    - name: Packages
      ansible.builtin.include_tasks: tasks/packages.yml
      vars:
        packages: [haproxy, keepalived]
      when: install_packages | bool

    - name: Allow binding the VIPs on the host that doesn't hold them
      ansible.builtin.copy:
        dest: /etc/sysctl.d/90-vip.conf
        content: "net.ipv4.ip_nonlocal_bind = 1\n"
        mode: "0644"
      register: sysctl_file

    - name: Apply sysctl
      ansible.builtin.command: sysctl -p /etc/sysctl.d/90-vip.conf
      when: sysctl_file.changed  # noqa: no-handler (before HAProxy binds the VIP)
      changed_when: true

    - name: SELinux booleans (detected with getenforce)
      ansible.builtin.include_tasks: tasks/selinux-ha.yml

    - name: haproxy.cfg (generated from the IP plan)
      ansible.builtin.template:
        src: templates/haproxy.cfg.j2
        dest: /etc/haproxy/haproxy.cfg
        mode: "0644"
        validate: haproxy -c -f %s
      register: haproxy_cfg

    - name: HAProxy running
      ansible.builtin.systemd_service:
        name: haproxy
        state: started
        enabled: true

    - name: Reload HAProxy
      ansible.builtin.systemd_service:
        name: haproxy
        state: reloaded
      when: haproxy_cfg.changed  # noqa: no-handler (before keepalived tracks HAProxy)

    - name: Restart HAProxy after an SELinux change (it may have failed to bind or connect)
      ansible.builtin.systemd_service:
        name: haproxy
        state: restarted
      when: selinux_active | bool and sebool_set.changed | default(false)  # noqa: no-handler

    - name: keepalived scripts (generated from the IP plan)
      ansible.builtin.template:
        src: templates/{{ item }}.j2
        dest: /etc/keepalived/{{ item }}
        mode: "0700"
        owner: root
        group: root
      loop: [check-proxy.sh, proxy-start.sh, proxy-stop.sh]

    - name: SELinux labels for the keepalived scripts
      ansible.builtin.include_tasks: tasks/selinux-keepalived-scripts.yml
      when: selinux_active | bool

    - name: VRRP interface from the settings
      ansible.builtin.set_fact:
        vrrp_if: "{{ vrrp_interface }}"

    - name: Otherwise the interface holding {{ ansible_host }}
      ansible.builtin.set_fact:
        vrrp_if: "{{ item }}"
      loop: "{{ ansible_facts.interfaces }}"
      when:
        - not vrrp_interface
        - (ansible_facts[item | replace('-', '_')].ipv4.address | default('')) == ansible_host

    - name: Interface found
      ansible.builtin.assert:
        that: vrrp_if | default('') | length > 0
        fail_msg: "no interface holds {{ ansible_host }}: set vrrp_interface in settings.yml"

    - name: keepalived.conf (generated from the IP plan)
      ansible.builtin.template:
        src: templates/keepalived.conf.j2
        dest: /etc/keepalived/keepalived.conf
        mode: "0600"
      register: keepalived_conf

    - name: keepalived running
      ansible.builtin.systemd_service:
        name: keepalived
        state: started
        enabled: true
      register: keepalived_started

    - name: Reload keepalived (keeps the VIPs where they are)
      ansible.builtin.systemd_service:
        name: keepalived
        state: reloaded
      when: keepalived_conf.changed and not keepalived_started.changed

    - name: VIPs on .135 after the first start
      ansible.builtin.command: ip -o addr
      register: vips
      until: (vips.stdout | regex_findall(' (' ~ (vip_rpc | regex_escape) ~ '|' ~ (vip_proxy | regex_escape) ~ ')/') | length) == 2
      retries: 20
      delay: 3
      changed_when: false
      when: inventory_hostname == coordinators[0].host and keepalived_started.changed

# keepalived starts the proxy only at the moment a host TAKES the VIP .151. If that start failed
# (e.g. SELinux blocked the script, or the image was missing then), nothing retries it. On every
# run: exactly one host holds .151, the proxy runs there and answers, and no proxy runs elsewhere.
- name: Proxy on the host holding the proxy VIP
  hosts: app_hosts
  become: true
  tasks:
    - name: Addresses on this host
      ansible.builtin.command: ip -o addr
      register: addrs
      changed_when: false

    - name: Does this host hold {{ vip_proxy }}?
      ansible.builtin.set_fact:
        holds_proxy_vip: "{{ (' ' ~ vip_proxy ~ '/') in addrs.stdout }}"

    - name: Exactly one host holds {{ vip_proxy }}
      ansible.builtin.assert:
        that: holders | length == 1
        fail_msg: >-
          {{ vip_proxy }} is held by {{ holders | length }} hosts ({{ holders | join(', ') or 'none' }}).
          None: keepalived is not MASTER anywhere (journalctl -u keepalived on .135 and .136).
          Two: the hosts don't see each other's VRRP messages (firewall, auth_pass).
      vars:
        holders: >-
          {{ ansible_play_hosts | zip(ansible_play_hosts | map('extract', hostvars, 'holds_proxy_vip'))
             | selectattr('1') | map(attribute='0') | list }}
      run_once: true  # noqa: run-once[task] (linear strategy)

    - name: Proxy running here?
      ansible.builtin.command: docker compose ps -q --status running proxy
      args:
        chdir: "{{ repo_dir }}/proxy"
      register: proxy_here
      changed_when: false

    - name: Start the proxy on the VIP holder (as keepalived would)
      ansible.builtin.command: /etc/keepalived/proxy-start.sh
      when: holds_proxy_vip | bool and proxy_here.stdout | length == 0
      changed_when: true

    - name: Stop a proxy on the host without the VIP (only one proxy may run)
      ansible.builtin.command: /etc/keepalived/proxy-stop.sh
      when: not holds_proxy_vip | bool and proxy_here.stdout | length > 0
      changed_when: true

    - name: Proxy answering on the VIP holder
      ansible.builtin.uri:
        url: "http://127.0.0.1:30000/status/senders"
      register: proxy_ok
      until: proxy_ok.status == 200
      retries: 40
      delay: 3
      when: holds_proxy_vip | bool
