# Imported at the start of phases 02-13: the hosts must have the code of the current checkout.
# 01-hosts.yml copies the committed code to the hosts (and 02-images.yml builds the images from that
# copy), then records which commit it copied (state/repo.commit). After a git pull or a new commit,
# run 01-hosts.yml (or site.yml) first, otherwise these phases would deploy the old code.
- name: Hosts have the current code (01-hosts.yml ran after the last change)
  hosts: localhost
  gather_facts: false
  tasks:
    - name: Last commit touching the deployed directories
      ansible.builtin.command: >-
        git -C {{ repo_root }} log -1 --format=%H -- {{ deployed_dirs | join(' ') }}
      register: code_head  # noqa: command-instead-of-module
      changed_when: false

    - name: Code copied to the hosts by 01-hosts.yml is that commit
      ansible.builtin.assert:
        that: copied == code_head.stdout
        fail_msg: >-
          The hosts have older code ({{ copied[:10] if copied else 'unknown' }}) than this checkout
          ({{ code_head.stdout[:10] }}): run ansible-playbook 01-hosts.yml first (or site.yml), which
          copies the current code to the hosts and the image builds.
        quiet: true
      vars:
        copied: "{{ (lookup('ansible.builtin.file', state_dir ~ '/repo.commit') | trim) if (state_dir ~ '/repo.commit') is file else '' }}"
