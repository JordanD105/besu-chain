# Checks before anything changes, and the operator's state directory + shared secrets.
- name: Operator checks and state
  hosts: localhost
  gather_facts: false
  tasks:
    - name: Settings are filled in
      ansible.builtin.assert:
        that:
          - operator_ip is match('^[0-9]+(\.[0-9]+){3}$')
          - client_ips is sequence and client_ips is not string
          - request_timeout | int > block_period | int
        fail_msg: >-
          Set operator_ip (this machine's IP, as the hosts see it) and client_ips in
          group_vars/all/settings.yml. The firewall only lets operator_ip in.

    - name: The IP plan (inventory.yml, settings.yml) is consistent
      ansible.builtin.assert:
        that:
          - (all_ips | unique | length) == (all_ips | length)
          - vip_prefix | int >= 8 and vip_prefix | int <= 32
          - groups['app_hosts'] | length == 2
          - all_ips | select('match', '^[0-9]+([.][0-9]+){3}$') | list | length == all_ips | length
        fail_msg: >-
          Every host IP and both VIPs must be distinct IPv4 addresses ({{ all_ips }}), vip_prefix a
          mask length (8-32), and app_hosts exactly the two HA hosts.
      vars:
        all_ips: "{{ groups['servers'] | map('extract', hostvars, 'ansible_host') | list + [vip_rpc, vip_proxy] }}"

    - name: Operator tools (docker for the image and genesis, git, curl)
      ansible.builtin.command: "{{ item }}"
      loop: ["docker info --format json", "git --version", "curl --version"]
      changed_when: false

    - name: State directories (mode 700)
      ansible.builtin.file:
        path: "{{ state_dir }}/{{ item }}"
        state: directory
        mode: "0700"
      loop: ["", secrets, mpc, besu, network, handoff, images]

    - name: Shared secrets (created once, then reused)
      ansible.builtin.set_fact:
        _secret: "{{ item }}"
      loop:
        - "{{ mpc_node_token }}"
        - "{{ mpc_admin_token }}"
        - "{{ mpc_metrics_token }}"
        - "{{ vrrp_pass_rpc }}"
        - "{{ vrrp_pass_proxy }}"
      no_log: true

    - name: Uncommitted changes are not deployed (the hosts get the committed HEAD)
      ansible.builtin.command: git -C {{ repo_root }} status --porcelain -- besu-production ha monitoring mpc-signer/deploy proxy chainlens contracts remix
      register: dirty
      changed_when: false

    - name: Warn about uncommitted changes
      ansible.builtin.debug:
        msg: "Not deployed (uncommitted): {{ dirty.stdout_lines }}"
      when: dirty.stdout | length > 0

- name: Host checks
  hosts: servers
  gather_facts: true
  tasks:
    - name: Host matches the IP plan (inventory.yml)
      ansible.builtin.assert:
        that:
          - ansible_host in ansible_facts.all_ipv4_addresses
          - ansible_facts.os_family in ['RedHat', 'Debian']
        fail_msg: >-
          {{ inventory_hostname }}: expected IP {{ ansible_host }} (inventory.yml) on this host, and a
          RHEL-family or Debian/Ubuntu system (found {{ ansible_facts.all_ipv4_addresses }},
          {{ ansible_facts.os_family }}).

    - name: VIPs not in use by any host
      ansible.builtin.assert:
        that:
          - vip_rpc not in ansible_facts.all_ipv4_addresses or inventory_hostname in groups['app_hosts']
          - vip_proxy not in ansible_facts.all_ipv4_addresses or inventory_hostname in groups['app_hosts']
        fail_msg: "{{ inventory_hostname }} uses a VIP address ({{ vip_rpc }} / {{ vip_proxy }}) as its own IP"
