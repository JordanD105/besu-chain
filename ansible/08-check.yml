# The application path through the VIPs, from the operator (like an application would).
- name: Hosts have the current code
  ansible.builtin.import_playbook: code-current.yml

- name: Check through the VIPs
  hosts: localhost
  gather_facts: false
  tasks:
    - name: Besu through HAProxy (VIP .150:8545)
      ansible.builtin.uri:
        url: "http://{{ vip_rpc }}:8545"
        method: POST
        body_format: json
        body: { jsonrpc: "2.0", id: 1, method: eth_blockNumber, params: [] }
      register: bn

    - name: MPC signer through HAProxy (VIP .150:9100)
      ansible.builtin.uri:
        url: "http://{{ vip_rpc }}:9100/health"

    - name: Proxy (VIP .151:30000)
      ansible.builtin.uri:
        url: "http://{{ vip_proxy }}:30000/status/senders"
        return_content: true
      register: senders

    - name: Proxy admin API and the section registry (VIP .151:30000/admin/sections)
      ansible.builtin.uri:
        url: "http://{{ vip_proxy }}:30000/admin/sections"
        headers:
          Authorization: "Bearer {{ proxy_admin_token }}"
        return_content: true
      register: sections
      until: sections.status == 200
      retries: 10
      delay: 3

    - name: Migrate the previous registry's sections (after an upgrade, once)
      ansible.builtin.uri:
        url: "http://{{ vip_proxy }}:30000/admin/registry/migrate"
        method: POST
        headers:
          Authorization: "Bearer {{ proxy_admin_token }}"
        body_format: json
        body:
          from: "{{ registry.previous }}"
          # the old registry's deployment block (its record from deploy-contract.js), to read its events from there
          fromBlock: "{{ (lookup('ansible.builtin.file', state_dir ~ '/registry-record/' ~ (registry.previous | lower) ~ '.json', errors='ignore')
                          | default('{}', true) | from_json).blockNumber | default(0) }}"
        timeout: 600
      register: migration
      when: registry.previous | default('') | length > 0 and not registry.migrated | default(false)

    - name: Migration done (state/registry.json)
      ansible.builtin.copy:
        dest: "{{ state_dir }}/registry.json"
        content: "{{ registry | combine({'migrated': true}) | to_nice_json }}\n"
        mode: "0600"
      when: migration is not skipped

    - name: Migrated sections
      ansible.builtin.debug:
        var: migration.json.sections
      when: migration is not skipped

    - name: Sections
      ansible.builtin.debug:
        msg: "SectionRegistry {{ sections.json.registry }}: {{ sections.json.sections | length }} section(s)"

    - name: Smoke test done before?
      ansible.builtin.stat:
        path: "{{ state_dir }}/smoke-test.json"
      register: smoke_done

    - name: Smoke test, once (new MPC account funded with 1 ETH, then a transfer from SENDER01)
      when: smoke_test | bool and not smoke_done.stat.exists and not sections_required | bool  # keyless calls are refused then
      block:
        - name: Create an account
          ansible.builtin.uri:
            url: "http://{{ vip_proxy }}:30000/createaccount"
            method: POST
            body_format: json
            body: { amount: "1" }
            timeout: 120
          register: account

        - name: Transfer from SENDER01
          ansible.builtin.uri:
            url: "http://{{ vip_proxy }}:30000/transfer"
            method: POST
            body_format: json
            body: { from: "{{ sender01 }}", to: "{{ account.json.address }}", amount: "0.01" }
            timeout: 120
          register: transfer

        - name: Record the smoke test
          ansible.builtin.copy:
            dest: "{{ state_dir }}/smoke-test.json"
            content: "{{ {'account': account.json, 'transfer': transfer.json} | to_nice_json }}"
            mode: "0600"

    - name: Application path
      ansible.builtin.debug:
        msg:
          - "block {{ bn.json.result | int(base=16) }} via {{ vip_rpc }}:8545"
          - "proxy {{ vip_proxy }}:30000 answers"
          - "{{ ('smoke test: account ' ~ account.json.address ~ ', transfer ' ~ (transfer.json.txHash | default(transfer.json)))
                if (account.json is defined) else 'smoke test: done before (state/smoke-test.json)' }}"

# Platform contracts, deployed once by the contract account center through the proxy VIP (after HA
# is up); 409 = it exists already, so reruns change nothing:
#   - TransferUndo (docs/features/transfer-undo.md): a section's +x / -x can be undone
#   - the avatar collections of platform_avatar_collections (docs/features/avatars.md)
#   - the nickname collection of platform_nickname_collection (docs/features/nicknames.md)
- name: Platform contracts (once)
  hosts: localhost
  gather_facts: false
  vars:
    deploy_url: "http://{{ vip_proxy }}:30000/admin/contract/deploy"
    can_deploy: "{{ contract_center != '' and registry.address is defined }}"
  tasks:
    - name: Deploy the transfer-undo contract
      ansible.builtin.uri:
        url: "{{ deploy_url }}"
        method: POST
        headers: { Authorization: "Bearer {{ proxy_admin_token }}" }
        body_format: json
        body: { template: transfer-undo }
        status_code: [200, 409]
        timeout: 300
      register: undo_deploy
      until: undo_deploy.status in [200, 409]
      retries: 10
      delay: 6
      when: can_deploy | bool
      no_log: true

    - name: Deploy the avatar collections (platform_avatar_collections)
      ansible.builtin.uri:
        url: "{{ deploy_url }}"
        method: POST
        headers: { Authorization: "Bearer {{ proxy_admin_token }}" }
        body_format: json
        body: { template: avatar-collection, name: "{{ item.name }}", symbol: "{{ item.symbol }}", holdDays: "{{ item.hold_days | default(7) }}" }
        status_code: [200, 409]
        timeout: 300
      loop: "{{ platform_avatar_collections | default([]) }}"
      loop_control:
        label: "{{ item.name }} ({{ item.symbol }})"
      register: avatar_deploy
      until: avatar_deploy.status in [200, 409]
      retries: 10
      delay: 6
      when: can_deploy | bool
      no_log: true

    - name: Deploy the nickname collection (platform_nickname_collection)
      ansible.builtin.uri:
        url: "{{ deploy_url }}"
        method: POST
        headers: { Authorization: "Bearer {{ proxy_admin_token }}" }
        body_format: json
        body: { template: nickname-collection, name: "{{ platform_nickname_collection.name }}", symbol: "{{ platform_nickname_collection.symbol }}", holdDays: "{{ platform_nickname_collection.hold_days | default(7) }}" }
        status_code: [200, 409]
        timeout: 300
      register: nickname_deploy
      until: nickname_deploy.status in [200, 409]
      retries: 10
      delay: 6
      when: can_deploy | bool and (platform_nickname_collection | default({})).name is defined
      no_log: true

    - name: Platform contracts
      ansible.builtin.debug:
        msg: "{{ summary }}"
      vars:
        found: "{{ ['exists', 'deployed'] }}"
        undo_line: "{{ ['transfer undo: ' ~ ('deployed' if undo_deploy.status | default(0) == 200 else 'exists')] if undo_deploy.status is defined else [] }}"
        avatar_lines: >-
          {{ (avatar_deploy.results | default([])) | selectattr('status', 'defined')
             | map(attribute='item.name') | map('regex_replace', '^', 'avatar collection ') | list }}
        avatar_states: "{{ (avatar_deploy.results | default([])) | selectattr('status', 'defined') | map(attribute='status') | map('string') | list }}"
        nickname_line: "{{ ['nickname collection ' ~ platform_nickname_collection.name ~ ': ' ~ ('deployed' if nickname_deploy.status == 200 else 'exists')] if nickname_deploy.status is defined else [] }}"
        summary: >-
          {{ undo_line + (avatar_lines | zip(avatar_states | map('replace', '200', 'deployed') | map('replace', '409', 'exists') | list)
             | map('join', ': ') | list) + nickname_line }}
      when: can_deploy | bool
