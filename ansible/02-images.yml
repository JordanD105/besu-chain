# Images. Built ONCE on the operator and copied to the hosts (docker save/load), so every host
# runs the identical image: the MPC signer (coordinators + MPC node hosts), the proxy (.135, .136)
# and chainlens + Remix (.139). Proxy and chainlens are built from the committed HEAD (state/build/).
# Third-party images (Besu, redis, Prometheus, Grafana) come from image_archives_dir when set,
# otherwise from Docker Hub. The base images of the builds (FROM lines) too: base-<image>.tar.
# offline_build: true builds everything without network (docs/deployment/offline-build.md).
- name: Hosts have the current code
  ansible.builtin.import_playbook: code-current.yml

- name: Build the images on the operator
  hosts: localhost
  gather_facts: false
  vars:
    mpc_tar: "{{ state_dir }}/images/{{ mpc_image | regex_replace('[/:]', '_') }}.tar"
  tasks:
    - name: Offline build, the package archives are in the repository (offline/make-offline.sh)
      ansible.builtin.assert:
        that: (repo_root ~ '/' ~ item) is file
        fail_msg: >-
          {{ item }} is missing: run offline/make-offline.sh on a machine with internet, commit the
          archives, then run 01-hosts.yml and this playbook again (docs/deployment/offline-build.md).
        quiet: true
      loop: "{{ offline_package_archives }}"
      when: offline_build | bool

    - name: Offline build, the package archives match offline/SHA256SUMS
      ansible.builtin.command: sha256sum -c --quiet offline/SHA256SUMS
      args:
        chdir: "{{ repo_root }}"
      changed_when: false
      when: offline_build | bool

    - name: Base images of the builds (the FROM lines of their Dockerfiles)
      ansible.builtin.shell: >-
        set -o pipefail;
        grep -hoE '^FROM [^ ]+' {{ build_dockerfiles | join(' ') }} | awk '{print $2}' | sort -u
      args:
        chdir: "{{ repo_root }}"
        executable: /bin/bash
      register: base_images
      changed_when: false

    - name: Base images present, or loaded from image_archives_dir (base-<image>.tar)
      ansible.builtin.shell: |
        docker image inspect {{ item | quote }} >/dev/null 2>&1 && { echo present; exit 0; }
        f={{ (image_archives_dir ~ '/base-' ~ (item | regex_replace('[/:]', '_')) ~ '.tar') | quote }}
        if [ -n {{ image_archives_dir | quote }} ] && [ -f "$f" ]; then
          docker load -q -i "$f" >/dev/null && docker image inspect {{ item | quote }} >/dev/null 2>&1 && { echo loaded; exit 0; }
          echo "$f does not hold {{ item }}" >&2; exit 1
        fi
        {% if offline_build | bool %}
        echo "{{ item }} is missing and $f does not exist: run save-images.yml on a machine with internet" >&2; exit 1
        {% else %}
        echo "pulled by the build"
        {% endif %}
      args:
        executable: /bin/bash
      loop: "{{ base_images.stdout_lines }}"
      register: base_loaded
      changed_when: "'loaded' in base_loaded.stdout"

    - name: MPC image present?
      ansible.builtin.command: docker image inspect {{ mpc_image }}
      register: img
      changed_when: false
      failed_when: false
      when: mpc_image_build | bool

    - name: Build the MPC image (several minutes)
      ansible.builtin.command: >-
        docker build {{ ('--build-arg BIGINT=' ~ mpc_bigint) if mpc_bigint else '' }}
        {{ '--network none' if offline_build | bool else '' }}
        -t {{ mpc_image }} {{ repo_root }}/mpc-signer
      when: mpc_image_build | bool and img.rc != 0
      changed_when: true

    - name: MPC image content ID (layers and config, the same for identical builds on every image store)
      ansible.builtin.shell: >-
        set -o pipefail;
        docker image inspect -f '{% raw %}{{json .RootFS.Layers}}{{json .Config}}{% endraw %}' {{ mpc_image }}
        | sha256sum | cut -d' ' -f1
      args:
        executable: /bin/bash
      register: mpc_id
      changed_when: false
      when: mpc_image_build | bool

    - name: Save the MPC image for the hosts (again after a rebuild)
      ansible.builtin.shell: >-
        docker save -o {{ mpc_tar }}.tmp {{ mpc_image }} && mv {{ mpc_tar }}.tmp {{ mpc_tar }}
        && printf '%s' '{{ mpc_id.stdout }}' > {{ mpc_tar }}.id
      when: >-
        mpc_image_build | bool
        and (lookup('ansible.builtin.file', mpc_tar ~ '.id') if (mpc_tar ~ '.id') is file else '') != mpc_id.stdout
      changed_when: true

    - name: Besu image on the operator (make-network.sh uses it)
      ansible.builtin.command: docker image inspect {{ besu_image }}
      register: op_besu
      changed_when: false
      failed_when: false

    - name: Load the Besu archive on the operator
      ansible.builtin.command: docker load -i {{ image_archives_dir }}/{{ image_archives.besu }}
      when: op_besu.rc != 0 and image_archives_dir | length > 0
      changed_when: true

    - name: Build directory
      ansible.builtin.file:
        path: "{{ state_dir }}/build"
        state: directory
        mode: "0700"

    - name: Committed sources (from 01-hosts.yml's archive)
      ansible.builtin.unarchive:
        src: "{{ state_dir }}/repo.tar.gz"
        dest: "{{ state_dir }}/build"

    - name: Remix site (remix-live at remix_commit; from image_archives_dir when there, otherwise fetched; once per commit)
      ansible.builtin.shell: |
        set -e
        d={{ (state_dir ~ '/build/remix/remix-live') | quote }}
        a={{ (image_archives_dir ~ '/' ~ remix_site_archive) | quote }}
        if [ "$(cat "$d/.remix-commit" 2>/dev/null || git -C "$d" rev-parse HEAD 2>/dev/null)" = {{ remix_commit | quote }} ]; then echo current; exit 0; fi
        if [ -n {{ image_archives_dir | quote }} ] && [ -f "$a" ]; then
          rm -rf "$d" && mkdir -p "$d" && tar -xzf "$a" -C "$d" && echo {{ remix_commit | quote }} > "$d/.remix-commit"
          echo extracted; exit 0
        fi
        {% if offline_build | bool %}
        echo "$a is missing: run offline/make-offline.sh --remix <image_archives_dir> on a machine with internet" >&2; exit 1
        {% endif %}
        rm -f "$d/.remix-commit"
        mkdir -p "$d" && cd "$d"
        [ -d .git ] || git init -q
        git fetch -q --depth 1 {{ remix_repo | quote }} {{ remix_commit | quote }}
        git checkout -q --force FETCH_HEAD && git clean -qfdx
      args:
        executable: /bin/bash
      register: remix_src
      changed_when: "'current' not in remix_src.stdout"
      when: remix_enabled | bool

    - name: Remix compilers from image_archives_dir (remix/Dockerfile installs solc from this npm cache)
      ansible.builtin.copy:
        src: "{{ image_archives_dir }}/{{ remix_solc_archive }}"
        dest: "{{ state_dir }}/build/remix/offline/solc-npm-cache.tgz"
        mode: "0644"
      when: remix_enabled | bool and image_archives_dir | length > 0 and (image_archives_dir ~ '/' ~ remix_solc_archive) is file

    - name: Offline build, Remix's compilers are there
      ansible.builtin.assert:
        that: (state_dir ~ '/build/remix/offline/solc-npm-cache.tgz') is file
        fail_msg: >-
          {{ image_archives_dir }}/{{ remix_solc_archive }} is missing: run offline/make-offline.sh --remix
          <image_archives_dir> on a machine with internet (docs/deployment/offline-build.md).
      when: remix_enabled | bool and offline_build | bool

    - name: Offline build, no network for the compose builds
      ansible.builtin.copy:
        dest: "{{ state_dir }}/build/{{ item }}/offline-build.yml"
        content: |
          # written by 02-images.yml (offline_build): build without network
          services:
            {{ item }}:
              build:
                network: none
        mode: "0644"
      loop: "{{ built_apps }}"
      when: offline_build | bool

    - name: Empty .env for the builds (compose reads env_file even when building)
      ansible.builtin.copy:
        dest: "{{ state_dir }}/build/{{ item }}/.env"
        content: ""
        mode: "0600"
        force: false
      loop: [proxy, chainlens]

    - name: Build the proxy, chainlens (remix, documentation site) images
      ansible.builtin.command: >-
        docker compose -f docker-compose.yml
        {% for f in build_compose_overrides[item] | default([]) %}-f {{ f }} {% endfor %}
        {{ '-f offline-build.yml' if offline_build | bool else '' }}
        build {{ item }}
      args:
        chdir: "{{ state_dir }}/build/{{ item }}"
      environment:
        COMPOSE_BAKE: "false"
        SOLC_VERSIONS: "{{ remix_solc_versions | join(' ') }}"
      loop: "{{ built_apps }}"
      changed_when: false

    - name: Image content IDs (layers and config, the same for identical builds on every image store)
      ansible.builtin.shell: >-
        set -o pipefail;
        docker image inspect -f '{% raw %}{{json .RootFS.Layers}}{{json .Config}}{% endraw %}' {{ app_images[item] }}
        | sha256sum | cut -d' ' -f1
      args:
        executable: /bin/bash
      loop: "{{ built_apps }}"
      register: app_ids
      changed_when: false

    - name: Save changed images for the hosts
      ansible.builtin.shell: >-
        docker save -o {{ state_dir }}/images/{{ item.item }}.tar {{ app_images[item.item] }}
        && printf '%s' '{{ item.stdout }}' > {{ state_dir }}/images/{{ item.item }}.id
      loop: "{{ app_ids.results }}"
      loop_control:
        label: "{{ item.item }}"
      when: (lookup('ansible.builtin.file', id_file) if id_file is file else '') != item.stdout
      vars:
        id_file: "{{ state_dir }}/images/{{ item.item }}.id"
      changed_when: true

    - name: Content IDs for the hosts
      ansible.builtin.set_fact:
        wanted_image_id: "{{ dict(built_apps | zip(app_ids.results | map(attribute='stdout'))) }}"
        wanted_mpc_id: "{{ mpc_id.stdout | default('') }}"

- name: MPC image on the coordinator and MPC node hosts
  hosts: app_hosts:mpc_hosts
  become: true
  vars:
    mpc_tar: "{{ state_dir }}/images/{{ mpc_image | regex_replace('[/:]', '_') }}.tar"
  tasks:
    - name: MPC image present?
      ansible.builtin.command: docker image inspect {{ mpc_image }}
      register: img
      changed_when: false
      failed_when: false

    - name: MPC image content ID on this host
      ansible.builtin.shell: >-
        set -o pipefail;
        docker image inspect -f '{% raw %}{{json .RootFS.Layers}}{{json .Config}}{% endraw %}' {{ mpc_image }}
        | sha256sum | cut -d' ' -f1
      args:
        executable: /bin/bash
      register: host_mpc_id
      changed_when: false
      when: img.rc == 0 and mpc_image_build | bool

    # Also after a rebuild on the operator (same tag, new content). Running coordinators switch to it
    # on the next 04-coordinators.yml; the MPC node teams restart their nodes (docs/operations/mpc-signer-upgrade.md).
    - name: Copy and load the MPC image (missing, or different from the operator's build)
      ansible.builtin.include_tasks: tasks/load-image.yml
      vars:
        tar: "{{ mpc_tar }}"
      when: >-
        mpc_image_build | bool
        and (img.rc != 0 or host_mpc_id.stdout != hostvars['localhost'].wanted_mpc_id)

    - name: Pull the MPC image from the registry
      ansible.builtin.command: docker pull {{ mpc_image }}
      when: img.rc != 0 and not mpc_image_build | bool
      changed_when: true

- name: Proxy image on .135 and .136
  hosts: app_hosts
  become: true
  tasks:
    - name: Proxy image
      ansible.builtin.include_tasks: tasks/ship-image.yml
      vars:
        app: proxy

- name: Chainlens image on .139
  hosts: monitoring_hosts
  become: true
  tasks:
    - name: Chainlens image
      ansible.builtin.include_tasks: tasks/ship-image.yml
      vars:
        app: chainlens

    - name: Remix image
      ansible.builtin.include_tasks: tasks/ship-image.yml
      vars:
        app: remix
      when: remix_enabled | bool

    - name: Documentation site image
      ansible.builtin.include_tasks: tasks/ship-image.yml
      vars:
        app: docs-site
      when: docs_site_enabled | bool

- name: Third-party images where they run
  hosts: servers
  become: true
  tasks:
    - name: Images for this host
      ansible.builtin.include_tasks: tasks/ensure-image.yml
      loop: >-
        {{ (['besu'] if inventory_hostname in groups['besu_hosts'] else [])
           + (['redis', 'redis_exporter'] if inventory_hostname in groups['app_hosts'] else [])
           + (['prometheus', 'grafana'] if inventory_hostname in groups['monitoring_hosts'] else []) }}
      loop_control:
        loop_var: key
