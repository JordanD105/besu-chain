# Prometheus + Grafana on the monitoring host (.139): files, Prometheus targets generated from the IP
# plan, settings, start, reload after a rule change, and a check that every target answers.
# Chainlens, Remix and the documentation site have their own playbooks (11, 12, 13).
#   ansible-playbook 09-monitoring.yml
- name: Hosts have the current code
  ansible.builtin.import_playbook: code-current.yml

- name: Prometheus and Grafana
  hosts: monitoring_hosts
  become: true
  tasks:
    - name: Monitoring files
      ansible.builtin.copy:
        src: "{{ repo_dir }}/monitoring/"
        dest: /opt/monitoring/
        remote_src: true
        mode: preserve
      register: monitoring_files

    - name: Monitoring settings created before?
      ansible.builtin.stat:
        path: /opt/monitoring/.env
      register: mon_env

    - name: setup.sh (Grafana password, MPC metrics token)
      ansible.builtin.command: ./setup.sh
      args:
        chdir: /opt/monitoring
      environment:
        MPC_METRICS_TOKEN: "{{ mpc_metrics_token }}"
      changed_when: not mon_env.stat.exists
      no_log: true

    - name: Prometheus targets directory (generated from the IP plan)
      ansible.builtin.file:
        path: /opt/monitoring/prometheus/targets.generated
        state: directory
        mode: "0755"

    - name: Prometheus targets (generated from the IP plan)
      ansible.builtin.template:
        src: templates/targets/{{ item }}.yml.j2
        dest: /opt/monitoring/prometheus/targets.generated/{{ item }}.yml
        mode: "0644"
      loop: [besu, mpc, proxy, redis, hosts, gateway]

    - name: BIND_IP and image versions
      ansible.builtin.lineinfile:
        path: /opt/monitoring/.env
        regexp: '^{{ item.key }}='
        line: "{{ item.key }}={{ item.value }}"
      loop:
        - { key: BIND_IP, value: "{{ ansible_host }}" }
        - { key: PROMETHEUS_IMAGE, value: "{{ prometheus_image }}" }
        - { key: GRAFANA_IMAGE, value: "{{ grafana_image }}" }
        - { key: PROMETHEUS_TARGETS_DIR, value: ./prometheus/targets.generated }
        - { key: PROMETHEUS_RETENTION, value: "{{ prometheus_retention | default('400d') }}" }
        - { key: PROMETHEUS_RETENTION_SIZE, value: "{{ prometheus_retention_size | default('20GB') }}" }
      loop_control:
        label: "{{ item.key }}"

    - name: Read the Grafana password
      ansible.builtin.slurp:
        src: /opt/monitoring/.env
      register: mon_env_content
      no_log: true

    - name: Keep the Grafana password in the operator state
      ansible.builtin.copy:
        dest: "{{ state_dir }}/secrets/grafana_admin_password"
        content: "{{ mon_env_content.content | b64decode | regex_search('GRAFANA_ADMIN_PASSWORD=(.*)', '\\1') | first }}\n"
        mode: "0600"
      delegate_to: localhost
      become: false
      no_log: true

    - name: Start Prometheus and Grafana
      ansible.builtin.command: docker compose up -d
      args:
        chdir: /opt/monitoring
      register: mon_up
      changed_when: mon_up.stderr is search('Started|Recreated|Created')

    - name: Reload Prometheus after a change of its config or rules (a bad rule fails here)
      ansible.builtin.uri:
        url: http://127.0.0.1:9090/-/reload
        method: POST
      register: prom_reload
      until: prom_reload.status == 200
      retries: 10
      delay: 3
      when: monitoring_files.changed  # noqa: no-handler (before the targets are checked)

    - name: Every metrics target answers (check-targets.sh)
      ansible.builtin.command: ./check-targets.sh
      args:
        chdir: /opt/monitoring
      register: targets
      until: targets.rc == 0
      retries: 10
      delay: 6
      changed_when: false

    - name: Targets
      ansible.builtin.debug:
        var: targets.stdout_lines
