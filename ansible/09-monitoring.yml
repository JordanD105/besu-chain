# Prometheus + Grafana, chainlens and the Remix IDE on .139.
- name: Hosts have the current code
  ansible.builtin.import_playbook: code-current.yml

- name: Monitoring and chainlens
  hosts: monitoring_hosts
  become: true
  tasks:
    - name: Monitoring files
      ansible.builtin.copy:
        src: "{{ repo_dir }}/monitoring/"
        dest: /opt/monitoring/
        remote_src: true
        mode: preserve
      register: monitoring_files

    - name: Monitoring settings created before?
      ansible.builtin.stat:
        path: /opt/monitoring/.env
      register: mon_env

    - name: setup.sh (Grafana password, MPC metrics token)
      ansible.builtin.command: ./setup.sh
      args:
        chdir: /opt/monitoring
      environment:
        MPC_METRICS_TOKEN: "{{ mpc_metrics_token }}"
      changed_when: not mon_env.stat.exists
      no_log: true

    - name: Prometheus targets directory (generated from the IP plan)
      ansible.builtin.file:
        path: /opt/monitoring/prometheus/targets.generated
        state: directory
        mode: "0755"

    - name: Prometheus targets (generated from the IP plan)
      ansible.builtin.template:
        src: templates/targets/{{ item }}.yml.j2
        dest: /opt/monitoring/prometheus/targets.generated/{{ item }}.yml
        mode: "0644"
      loop: [besu, mpc, proxy, hosts]

    - name: BIND_IP and image versions
      ansible.builtin.lineinfile:
        path: /opt/monitoring/.env
        regexp: '^{{ item.key }}='
        line: "{{ item.key }}={{ item.value }}"
      loop:
        - { key: BIND_IP, value: "{{ ansible_host }}" }
        - { key: PROMETHEUS_IMAGE, value: "{{ prometheus_image }}" }
        - { key: GRAFANA_IMAGE, value: "{{ grafana_image }}" }
        - { key: PROMETHEUS_TARGETS_DIR, value: ./prometheus/targets.generated }
      loop_control:
        label: "{{ item.key }}"

    - name: Read the Grafana password
      ansible.builtin.slurp:
        src: /opt/monitoring/.env
      register: mon_env_content
      no_log: true

    - name: Keep the Grafana password in the operator state
      ansible.builtin.copy:
        dest: "{{ state_dir }}/secrets/grafana_admin_password"
        content: "{{ mon_env_content.content | b64decode | regex_search('GRAFANA_ADMIN_PASSWORD=(.*)', '\\1') | first }}\n"
        mode: "0600"
      delegate_to: localhost
      become: false
      no_log: true

    - name: Start Prometheus and Grafana
      ansible.builtin.command: docker compose up -d
      args:
        chdir: /opt/monitoring
      register: mon_up
      changed_when: mon_up.stderr is search('Started|Recreated|Created')

    - name: Reload Prometheus after a change of its config or rules (a bad rule fails here)
      ansible.builtin.uri:
        url: http://127.0.0.1:9090/-/reload
        method: POST
      register: prom_reload
      until: prom_reload.status == 200
      retries: 10
      delay: 3
      when: monitoring_files.changed  # noqa: no-handler (before the targets are checked)

    - name: Every metrics target answers (check-targets.sh)
      ansible.builtin.command: ./check-targets.sh
      args:
        chdir: /opt/monitoring
      register: targets
      until: targets.rc == 0
      retries: 10
      delay: 6
      changed_when: false

    - name: Targets
      ansible.builtin.debug:
        var: targets.stdout_lines

    - name: Deploy page settings are complete
      ansible.builtin.assert:
        that:
          - chainlens_deployer is match('^0x[0-9a-fA-F]{40}$')
          - sender01 | length > 0
          - chainlens_deployer | lower != sender01 | lower
        fail_msg: >-
          chainlens_deploy_enabled needs chainlens_deployer: an MPC account used only for deployments
          (not SENDER01), created once with the proxy's POST /createaccount (see settings.yml).
      when: chainlens_deploy_enabled | bool

    - name: Directory for the Deploy page's records (the chainlens container user is uid 1000)
      ansible.builtin.file:
        path: "{{ chainlens_local_registry }}"
        state: directory
        owner: "1000"
        group: "1000"
        mode: "0750"

    - name: Chainlens settings
      ansible.builtin.template:
        src: templates/chainlens.env.j2
        dest: "{{ repo_dir }}/chainlens/.env"
        mode: "0600"

    - name: Chainlens (image from 02-images.yml)
      ansible.builtin.command: docker compose up -d
      args:
        chdir: "{{ repo_dir }}/chainlens"
      register: cl_up
      changed_when: cl_up.stderr is search('Started|Recreated')

    - name: Chainlens answering
      ansible.builtin.uri:
        url: "http://{{ ansible_host }}:30100/"
      register: cl
      until: cl.status == 200
      retries: 20
      delay: 3

    - name: Contracts deployed from the Deploy page
      ansible.builtin.find:
        paths: "{{ chainlens_local_registry }}"
        patterns: "0x*.json"
      register: local_records

    - name: Copy their records back to the operator's repository (contracts/deployments)
      ansible.builtin.fetch:
        src: "{{ item.path }}"
        dest: "{{ repo_root }}/contracts/deployments/"
        flat: true
      loop: "{{ local_records.files }}"
      loop_control:
        label: "{{ item.path | basename }}"

    - name: Records not committed yet
      ansible.builtin.command: git -C {{ repo_root }} status --porcelain -- contracts/deployments  # noqa: command-instead-of-module
      delegate_to: localhost
      become: false
      register: uncommitted
      changed_when: false

    - name: Commit them
      ansible.builtin.debug:
        msg:
          - "Contract records not committed yet (from the Deploy page or deploy-contract.js):"
          - "{{ uncommitted.stdout_lines }}"
          - "Commit them: git -C {{ repo_root }} add contracts/deployments && git -C {{ repo_root }} commit -m 'Contract deployments'"
      when: uncommitted.stdout | length > 0

    - name: Remix settings
      ansible.builtin.copy:
        dest: "{{ repo_dir }}/remix/.env"
        content: "BIND_IP={{ ansible_host }}\n"
        mode: "0644"
      when: remix_enabled | bool

    - name: Remix IDE (image from 02-images.yml)
      ansible.builtin.command: docker compose up -d --no-build
      args:
        chdir: "{{ repo_dir }}/remix"
      register: remix_up
      changed_when: remix_up.stderr is search('Started|Recreated')
      when: remix_enabled | bool

    - name: Remix answering, with its compiler list
      ansible.builtin.uri:
        url: "http://{{ ansible_host }}:30200/solc-bin/list.json"
      register: remix_list
      until: remix_list.status == 200
      retries: 20
      delay: 3
      when: remix_enabled | bool

    - name: Remix stopped (remix_enabled false)
      ansible.builtin.shell: >-
        [ ! -f docker-compose.yml ] || [ -z "$(docker compose ps -q 2>/dev/null)" ]
        || { docker compose down && echo stopped; }
      args:
        chdir: "{{ repo_dir }}/remix"
      register: remix_down
      changed_when: "'stopped' in remix_down.stdout"
      when: not remix_enabled | bool
