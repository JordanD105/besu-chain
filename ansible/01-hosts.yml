# Every host: packages, the repository in /opt/besu-chain, firewall, node-exporter.
- name: Package the repository (committed HEAD)
  hosts: localhost
  gather_facts: false
  tasks:
    - name: Archive the deployable directories
      ansible.builtin.command: >-
        git -C {{ repo_root }} archive --format=tar.gz -o {{ state_dir }}/repo.tar.gz HEAD
        {{ deployed_dirs | join(' ') }}
      changed_when: false

- name: Prepare the hosts
  hosts: servers
  become: true
  tasks:
    - name: Packages
      ansible.builtin.include_tasks: tasks/packages.yml
      vars:
        packages: >-
          {{ ['docker-ce', 'docker-ce-cli', 'containerd.io', 'docker-compose-plugin', 'chrony', 'firewalld', 'nftables',
              'curl', 'tar', 'gzip', 'rsync']
             + (['cronie'] if ansible_facts.os_family == 'RedHat' else ['cron']) }}
        docker_repo: true
      when: install_packages | bool

    - name: Services running
      ansible.builtin.systemd_service:
        name: "{{ item }}"
        state: started
        enabled: true
      loop:
        - docker
        - firewalld
        - "{{ 'chronyd' if ansible_facts.os_family == 'RedHat' else 'chrony' }}"
        - "{{ 'crond' if ansible_facts.os_family == 'RedHat' else 'cron' }}"

    - name: Time servers (ntp_servers)
      ansible.builtin.include_tasks: tasks/ntp.yml

    - name: firewalld answering
      ansible.builtin.command: firewall-cmd --state
      register: fw_state
      changed_when: false
      failed_when: false

    - name: Reload D-Bus and restart firewalld when it doesn't answer (policy installed after D-Bus started)
      ansible.builtin.shell: systemctl reload dbus && systemctl restart firewalld && sleep 2 && firewall-cmd --state
      when: fw_state.rc != 0
      changed_when: true

    - name: Clock synchronized
      ansible.builtin.command: chronyc tracking
      register: chrony
      changed_when: false
      failed_when: false

    - name: Warn when the clock is not synchronized
      ansible.builtin.debug:
        msg: "{{ inventory_hostname }}: chrony is not synchronized yet. QBFT and the alerts need synchronized clocks."
      when: chrony.rc != 0 or 'Normal' not in chrony.stdout

    - name: Repository directory
      ansible.builtin.file:
        path: "{{ repo_dir }}"
        state: directory
        mode: "0755"

    - name: Repository files
      ansible.builtin.unarchive:
        src: "{{ state_dir }}/repo.tar.gz"
        dest: "{{ repo_dir }}"

    - name: Firewall rules before
      ansible.builtin.command: firewall-cmd --permanent --list-rich-rules
      register: fw_before
      changed_when: false

    - name: Firewall (ha/firewall-layout.sh)
      ansible.builtin.command: "{{ repo_dir }}/ha/firewall-layout.sh"
      environment:
        ADMIN: "{{ operator_ip }}"
        PROXY_CLIENTS: "{{ proxy_client_ips | join(' ') }}"
        CHAINLENS_USERS: "{{ (chainlens_ips + (chainlens_deploy_ips if chainlens_deploy_enabled | bool else [])) | unique | join(' ') }}"
        GRAFANA_USERS: "{{ grafana_ips | join(' ') }}"
        REMIX_USERS: "{{ remix_ips | join(' ') }}"
        ROLE: >-
          {{ 'app' if inventory_hostname in groups['app_hosts'] else
             ('monitoring' if inventory_hostname in groups['monitoring_hosts'] else 'node') }}
        PEER: "{{ ip_of[ha_peer] if inventory_hostname in groups['app_hosts'] else '' }}"
        HAS_MPC: "{{ '1' if inventory_hostname in groups['mpc_hosts'] else '0' }}"
        BESU_HOSTS: "{{ groups['besu_hosts'] | map('extract', ip_of) | join(' ') }}"
        MPC_HOSTS: "{{ groups['mpc_hosts'] | map('extract', ip_of) | join(' ') }}"
        COORDS: "{{ groups['app_hosts'] | map('extract', ip_of) | join(' ') }}"
        MON: "{{ groups['monitoring_hosts'] | map('extract', ip_of) | join(' ') }}"
      register: fw
      changed_when: false

    - name: Firewall rules after
      ansible.builtin.command: firewall-cmd --permanent --list-rich-rules
      register: fw_after
      changed_when: fw_after.stdout != fw_before.stdout

    - name: Textfile directory for the backup metrics
      ansible.builtin.file:
        path: /var/lib/node_exporter/textfile
        state: directory
        mode: "0755"

    - name: node-exporter image
      ansible.builtin.include_tasks: tasks/ensure-image.yml
      vars:
        key: node_exporter

    - name: node-exporter settings
      ansible.builtin.copy:
        dest: "{{ repo_dir }}/monitoring/node-exporter/.env"
        content: "BIND_IP={{ ansible_host }}\nNODE_EXPORTER_IMAGE={{ node_exporter_image }}\n"
        mode: "0644"

    - name: node-exporter
      ansible.builtin.command: docker compose up -d
      args:
        chdir: "{{ repo_dir }}/monitoring/node-exporter"
      register: ne
      changed_when: ne.stderr is search('Started|Recreated|Created')

- name: Record which code the hosts have (checked by phases 02-10, code-current.yml)
  hosts: localhost
  gather_facts: false
  tasks:
    - name: Last commit touching the deployed directories
      ansible.builtin.command: >-
        git -C {{ repo_root }} log -1 --format=%H -- {{ deployed_dirs | join(' ') }}
      register: code_head  # noqa: command-instead-of-module
      changed_when: false

    - name: Recorded
      ansible.builtin.copy:
        dest: "{{ state_dir }}/repo.commit"
        content: "{{ code_head.stdout }}\n"
        mode: "0644"
