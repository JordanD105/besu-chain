# Documentation website (docs/): built by docs-site/Dockerfile, served by nginx on :30300.
#   docker compose -f docs-site/docker-compose.yml up -d --build      (from the repository root)
site_name: besu-chain documentation
site_description: Private Besu (QBFT) chain with MPC signing, sections, NFTs, HA and monitoring
docs_dir: ../docs
use_directory_urls: false

theme:
  name: material
  font: false            # no Google Fonts: the site works without internet access
  language: en
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: deep orange
      toggle: { icon: material/weather-night, name: Dark mode }
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: deep orange
      toggle: { icon: material/weather-sunny, name: Light mode }
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.footer
    - navigation.indexes
    - toc.follow
    - search.highlight
    - search.suggest
    - content.code.copy

plugins:
  # English and Korean pages and search, all built into the image (no internet when serving)
  - search:
      lang: [en, ko]
  # English at /, Korean at /ko/ from the *.ko.md file next to each page (English when missing)
  - i18n:
      docs_structure: suffix
      fallback_to_default: true
      reconfigure_material: true
      reconfigure_search: true
      languages:
        - locale: en
          default: true
          name: English
          build: true
        - locale: ko
          name: 한국어
          build: true
          site_name: besu-chain 문서
          nav_translations:
            Home: 홈
            Overview: 개요
            Introduction: 소개
            Architecture: 아키텍처
            Production layout: 운영 환경 구성
            Glossary: 용어집
            Getting started: 시작하기
            Development environment: 개발 환경
            Deployment: 배포
            Operator guide: 운영자 가이드
            Ansible: Ansible
            Access control: 접근 제어
            High availability: 고가용성
            Besu manual setup: Besu 수동 설정
            MPC signer in production: 운영 환경의 MPC 서명기
            GPG key: GPG 키
            Offline build: 오프라인 빌드
            Components: 구성 요소
            Hyperledger Besu chain: Hyperledger Besu 체인
            Proxy: 프록시
            MPC signer: MPC 서명기
            Chainlens: Chainlens
            Remix: Remix
            Monitoring: 모니터링
            Documentation website: 문서 웹사이트
            Section gateway: 섹션 게이트웨이
            Features: 기능
            Sections: 섹션
            Contract deployment: 컨트랙트 배포
            Contract records: 컨트랙트 기록
            Avatars: 아바타
            Nicknames: 닉네임
            Memos: 메모
            Operations: 운영
            Alerts: 알림
            Alert runbook: 알림 런북
            Grafana dashboards: Grafana 대시보드
            Troubleshooting: 문제 해결
            Disaster recovery: 재해 복구
            Restore with Ansible: Ansible로 복원
            Adding and removing nodes: 노드 추가와 제거
            MPC signer upgrade: MPC 서명기 업그레이드
            Reference: 참조
            Proxy API: 프록시 API
            Development: 개발
            MPC benchmarks: MPC 벤치마크
            Paladin: Paladin

hooks:
  - hooks.py

markdown_extensions:
  - tables
  - admonition
  - attr_list
  - md_in_html
  - toc:
      permalink: true
      # GitHub's anchor rules, so the same links work on GitHub and on this site
      slugify: !!python/object/apply:pymdownx.slugs.slugify
        kwds:
          case: lower
  - pymdownx.superfences
  - pymdownx.details

validation:
  links:
    not_found: warn
    anchors: warn

nav:
  - Home: README.md
  - Overview:
      - Introduction: overview/introduction.md
      - Architecture: overview/architecture.md
      - Production layout: overview/production-layout.md
      - Glossary: glossary.md
  - Getting started:
      - Development environment: getting-started/development.md
  - Deployment:
      - Operator guide: deployment/operator-guide.md
      - Ansible: deployment/ansible.md
      - Access control: deployment/access-control.md
      - High availability: deployment/high-availability.md
      - Besu manual setup: deployment/besu-manual.md
      - MPC signer in production: deployment/mpc-signer-production.md
      - GPG key: deployment/gpg-key.md
      - Offline build: deployment/offline-build.md
  - Components:
      - Hyperledger Besu chain: components/besu.md
      - Proxy: components/proxy.md
      - MPC signer: components/mpc-signer.md
      - Chainlens: components/chainlens.md
      - Remix: components/remix.md
      - Monitoring: components/monitoring.md
      - Documentation website: components/docs-site.md
      - Section gateway: components/gateway.md
  - Features:
      - Sections: features/sections.md
      - Contract deployment: features/contract-deployment.md
      - Contract records: features/contract-records.md
      - Avatars: features/avatars.md
      - Nicknames: features/nicknames.md
      - Memos: features/memos.md
  - Operations:
      - Alerts: operations/alerts.md
      - Alert runbook: operations/alert-runbook.md
      - Grafana dashboards: operations/dashboards.md
      - Troubleshooting: operations/troubleshooting.md
      - Disaster recovery: operations/disaster-recovery.md
      - Restore with Ansible: operations/restore.md
      - Adding and removing nodes: operations/adding-nodes.md
      - MPC signer upgrade: operations/mpc-signer-upgrade.md
  - Reference:
      - Proxy API: reference/proxy-api.md
  - Development:
      - MPC benchmarks: development/mpc-benchmarks.md
      - Paladin: development/paladin.md
