# Documentation website (docs/components/docs-site.md). From the repository root:
#   docker compose -f docs-site/docker-compose.yml up -d --build      then open http://<host>:30300
# The Ansible deployment builds the image (02-images.yml) and runs it on the monitoring host
# (09-monitoring.yml, docs_site_enabled).
services:
  docs-site:
    build:
      context: ..
      dockerfile: docs-site/Dockerfile
    image: localhost/besu-docs/docs
    restart: unless-stopped
    ports:
      - "${BIND_IP:-0.0.0.0}:${PORT:-30300}:30300"
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /var/run
      - /tmp
