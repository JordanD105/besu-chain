# Prometheus scrape config for the production Besu nodes (metrics port 9545 on each private IP).
# Merge into your Prometheus; Grafana dashboard: Besu Full (grafana.com id 10273).
scrape_configs:
  - job_name: besu
    scrape_interval: 15s
    metrics_path: /metrics
    static_configs:
      - targets: ["10.10.1.11:9545", "10.10.2.11:9545", "10.10.3.11:9545", "10.10.4.11:9545"]
        labels: { role: validator }
      - targets: ["10.10.1.21:9545", "10.10.2.21:9545"]
        labels: { role: rpc }
# Suggested alerts: no new block for 3 x block period; peer count < expected;
# validator missing from qbft_getValidatorsByBlockNumber; disk > 80 %; node down.
